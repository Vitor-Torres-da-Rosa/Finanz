    var gradeResumo = no('div', 'resumo-grade');
    gradeResumo.style.marginTop = '0';
    [['Entradas', entradas, 'verde'], ['Saídas', saidas, 'vermelho'],
     ['Lançamentos', itens.length, '']].forEach(function (item) {
      var d = no('div');
      d.appendChild(no('div', 'r', item[0]));
      d.appendChild(no('div', 'v ' + item[2], item[0] === 'Lançamentos' ? String(item[1]) : emReais(item[1])));
      gradeResumo.appendChild(d);
    });
    resumo.appendChild(gradeResumo);
    resumo.appendChild(no('div', 'linha-nota', 'De ' + dataBr(faixa.de) + ' a ' + dataBr(faixa.ate) + '.'));
    alvo.appendChild(resumo);
  }

  function linhaLancamento(l) {
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = l.tipo === 'entrada' ? '#34D399' : l.tipo === 'saida' ? '#F87171' : '#60A5FA';
    var sinal = l.tipo === 'entrada' ? '+' : l.tipo === 'saida' ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var origem = achar(estado.contas, l.contaId);
      var destino = achar(estado.contas, l.contaDestinoId);
      sub = (origem ? origem.nome : '—') + ' → ' + (destino ? destino.nome : '—');
    } else {
      var conta = achar(estado.contas, l.contaId);
      sub = l.categoria + (conta ? ' · ' + conta.nome : '');
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (l.tipo === 'entrada' ? 'verde' : l.tipo === 'saida' ? 'vermelho' : ''),
          (l.tipo === 'entrada' ? '+ ' : l.tipo === 'saida' ? '− ' : '') + emReais(l.valor)))
    );
    return b;
  }

  // Lançamentos que passaram por esta conta, do mais novo para o mais antigo.
  function lancamentosDaConta(id) {
    return estado.lancamentos.filter(function (l) {
      return l.contaId === id || l.contaDestinoId === id;
    }).sort(function (a, b) {
      if (a.data !== b.data) return a.data < b.data ? 1 : -1;
      return (b.criadoEm || 0) - (a.criadoEm || 0);
    });
  }

  // Quanto este lançamento mexeu nesta conta: positivo entra, negativo sai.
  function efeitoNaConta(l, id) {
    if (l.tipo === 'entrada') return l.contaId === id ? l.valor : 0;
    if (l.tipo === 'saida') return l.contaId === id ? -l.valor : 0;
    if (l.contaDestinoId === id) return l.valor;
    if (l.contaId === id) return -l.valor;
    return 0;
  }

  function linhaExtrato(l, id) {
    var efeito = efeitoNaConta(l, id);
    var b = botao('linha', null, function () { abrirFolhaLancamento(l.id); });
    var cor = efeito > 0 ? '#34D399' : efeito < 0 ? '#F87171' : '#60A5FA';
    var sinal = efeito > 0 ? '+' : efeito < 0 ? '−' : '⇄';

    var sub;
    if (l.tipo === 'transferencia') {
      var outra = achar(estado.contas, l.contaDestinoId === id ? l.contaId : l.contaDestinoId);
      sub = (efeito > 0 ? 'Veio de ' : 'Foi para ') + (outra ? outra.nome : 'outra conta');
    } else {
      sub = l.categoria;
    }

    juntar(b,
      selo(cor, sinal),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || (l.tipo === 'transferencia' ? 'Transferência' : l.categoria)),
        no('div', 'linha-sub', sub)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num ' + (efeito > 0 ? 'verde' : efeito < 0 ? 'vermelho' : ''),
          (efeito > 0 ? '+ ' : efeito < 0 ? '− ' : '') + emReais(Math.abs(efeito) || l.valor)))
    );
    return b;
  }

  // Duas transações iguais no mesmo dia costumam ser importação repetida.
  // Não é prova, então eu só aponto: quem decide é quem viu o extrato.
  function repetidosDaConta(id) {
    var mapa = {};
    lancamentosDaConta(id).forEach(function (l) {
      var k = l.data + '|' + l.valor + '|' + l.tipo + '|' + (l.descricao || '');
      (mapa[k] = mapa[k] || []).push(l);
    });
    var grupos = [];
    Object.keys(mapa).forEach(function (k) { if (mapa[k].length > 1) grupos.push(mapa[k]); });
    grupos.sort(function (a, b) { return a[0].data < b[0].data ? 1 : -1; });
    return grupos;
  }

  function resumoDaConta(id) {
    var r = { entradas: 0, saidas: 0, entrou: 0, saiu: 0, quantos: 0,
              transferencias: 0, futuros: 0, primeira: '', ultima: '' };
    var hoje = hojeTexto();
    lancamentosDaConta(id).forEach(function (l) {
      r.quantos++;
      if (l.data > hoje) r.futuros++;
      if (!r.ultima || l.data > r.ultima) r.ultima = l.data;
      if (!r.primeira || l.data < r.primeira) r.primeira = l.data;
      if (l.tipo === 'transferencia') { r.transferencias++; }
      var e = efeitoNaConta(l, id);
      if (e > 0) { r.entradas++; r.entrou += e; }
      else if (e < 0) { r.saidas++; r.saiu += -e; }
    });
    return r;
  }

  // Saldo mês a mês. É por aqui que se acha onde a conta descolou do banco:
  // basta comparar cada linha com o extrato daquele mês.
  function saldoPorMes(id) {
    var conta = achar(estado.contas, id);
    var linhas = [];
    var porMes = {};
    lancamentosDaConta(id).forEach(function (l) {
      var k = l.data.slice(0, 7);
      if (!porMes[k]) porMes[k] = { entrou: 0, saiu: 0, quantos: 0 };
      var e = efeitoNaConta(l, id);
      porMes[k].quantos++;
      if (e > 0) porMes[k].entrou += e; else porMes[k].saiu += -e;
    });
    var chaves = Object.keys(porMes).sort();
    var corrente = conta ? conta.saldoInicial : 0;
    chaves.forEach(function (k) {
      var m = porMes[k];
      corrente += m.entrou - m.saiu;
      linhas.push({ mes: k, entrou: m.entrou, saiu: m.saiu, quantos: m.quantos, saldo: corrente });
    });
    linhas.reverse();
    return linhas;
  }

  // Data e hora de quando o lançamento entrou no app. É o que separa duas
  // transações idênticas uma da outra.
  function quandoEntrou(ms) {
    var d = new Date(inteiro(ms) || Date.now());
    return dataBr(deData(d)) + ' às ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') +
      ':' + String(d.getSeconds()).padStart(2, '0');
  }

  function nomeDoMesChave(k) {
    var p = k.split('-');
    return MESES[+p[1] - 1].slice(0, 3) + '/' + p[0].slice(2);
  }

  // Tirar uma importação inteira: os lançamentos daquela leva somem, e o
  // registro dela também.
  function desfazerImportacao(impId, aoTerminar) {
    var imp = null;
    (estado.importacoes || []).forEach(function (i) { if (i.id === impId) imp = i; });
    if (!imp) return;
    perguntar({
      titulo: 'Tirar esta importação?',
      texto: 'Isso apaga os ' + imp.quantos + ' lançamento(s) que entraram nessa leva' +
             (imp.arquivo ? ' (' + imp.arquivo + ')' : '') + '. O que você lançou à mão não é tocado.',
      ok: 'Tirar tudo', tom: 'perigo'
    }, function () {
      var tirados = 0;
      estado.lancamentos = estado.lancamentos.filter(function (l) {
        if (l.importacaoId !== impId) return true;
        marcarExcluido('lancamentos', l.id);
        tirados++;
        return false;
      });
      estado.importacoes = (estado.importacoes || []).filter(function (i) { return i.id !== impId; });
      salvar();
      avisar(tirados + ' lançamento(s) removidos.');
      if (aoTerminar) aoTerminar();
    });
  }

  function abrirFolhaConferencia(id) {
    var conta = achar(estado.contas, id);
    if (!conta) return;

    abrirFolha('Conferir ' + conta.nome, function (folha) {

      forma.appendChild(no('p', 'linha-sub',

      conf.appendChild(no('div', 'rotulo', 'Saldo pelo app'));
      conf.appendChild(no('div', 'valorao num' + (saldo < 0 ? ' vermelho' : ''), emReais(saldo)));
      conf.appendChild(no('div', 'linha-nota',

        perguntar({

                 '.\n\nIsso serve quando o extrato que você importou não pega desde o começo da conta. ' +
                 'Se o que está errado são os lançamentos, é melhor tirar a importação lá embaixo.',
          ok: 'Acertar'
        }, function () {

      ajustar.style.marginTop = '10px';

      function medirDiferenca() {
        var alvo = digitosParaCentavos(campoBanco.value);

      }
      campoBanco.addEventListener('input', medirDiferenca);
      campoBanco.addEventListener('change', medirDiferenca);

      // ---- o que tem dentro ----
      var num = cartao('liso');
      num.appendChild(no('div', 'rotulo', 'O que está lançado'));
      var grade = no('div', 'grade-conf');
      [['Lançamentos', String(r.quantos)],
       ['Entradas', r.entradas + ' · ' + emReais(r.entrou)],
       ['Saídas', r.saidas + ' · ' + emReais(r.saiu)],
       ['Transferências', String(r.transferencias)],
       ['Primeiro', r.primeira ? dataBr(r.primeira) : '—'],
       ['Último', r.ultima ? dataBr(r.ultima) : '—']].forEach(function (par) {
        var b = no('div', 'conf-item');
        b.appendChild(no('div', 'conf-rotulo', par[0]));
        b.appendChild(no('div', 'conf-valor', par[1]));
        grade.appendChild(b);
      });
      num.appendChild(grade);
      if (r.futuros) {
        num.appendChild(no('div', 'linha-nota vermelho',
          r.futuros + ' lançamento(s) com data no futuro. Isso costuma ser ano lido errado no extrato.'));
      }
      forma.appendChild(num);

      // ---- mês a mês ----
      var meses = saldoPorMes(id);
      if (meses.length) {
        var mm = cartao('liso');
        mm.appendChild(no('div', 'rotulo', 'Mês a mês'));
        mm.appendChild(no('div', 'linha-nota',
          'O saldo de cada linha é como a conta fechou naquele mês. Compare com o extrato ' +
          'do banco para achar onde as contas se separam.'));
        // Conta de anos inteiros não cabe numa tela só, e cortar os mais
        // antigos esconde justo onde a diferença costuma começar.
        var caixaMeses = no('div');
        mm.appendChild(caixaMeses);
        var pagMes = 0;
        var POR_PAGINA_MES = 12;

        function desenharMeses() {
          var paginas = Math.max(1, Math.ceil(meses.length / POR_PAGINA_MES));
          pagMes = Math.min(Math.max(pagMes, 0), paginas - 1);
          var de = pagMes * POR_PAGINA_MES;
          var ate = Math.min(de + POR_PAGINA_MES, meses.length);
          caixaMeses.textContent = '';

          function barra() {
            var b = no('div', 'paginas');
            var antes = botao('btn-mini', '‹ Anteriores', function () { pagMes--; desenharMeses(); });
            antes.disabled = pagMes === 0;
            var depois = botao('btn-mini', 'Próximos ›', function () { pagMes++; desenharMeses(); });
            depois.disabled = pagMes >= paginas - 1;
            juntar(b, antes,
              no('span', 'paginas-conta', (de + 1) + '–' + ate + ' de ' + meses.length + ' meses'),
              depois);
            return b;
          }

          if (paginas > 1) caixaMeses.appendChild(barra());
          var tab = no('div', 'tabela-conf');
          var cab = no('div', 'conf-linha conf-cab');
          ['Mês', 'Entrou', 'Saiu', 'Saldo'].forEach(function (t) { cab.appendChild(no('span', null, t)); });
          tab.appendChild(cab);
          meses.slice(de, ate).forEach(function (m) {

            l.appendChild(no('span', null, nomeDoMesChave(m.mes)));
            l.appendChild(no('span', 'verde', emReais(m.entrou)));
            l.appendChild(no('span', 'vermelho', emReais(m.saiu)));
            l.appendChild(no('span', 'num' + (m.saldo < 0 ? ' vermelho' : ''), emReais(m.saldo)));
            tab.appendChild(l);
          });
          caixaMeses.appendChild(tab);
          if (paginas > 1) caixaMeses.appendChild(barra());
        }
        desenharMeses();
        forma.appendChild(mm);
      }

      // ---- possíveis repetidos ----
      var grupos = repetidosDaConta(id);
      if (grupos.length) {
        var rep = cartao('liso');
        rep.appendChild(no('div', 'rotulo', 'Possíveis repetidos'));
        rep.appendChild(no('div', 'linha-nota',
          grupos.length + ' grupo(s) com data, valor e descrição iguais. Pode ser importação ' +
          'repetida — ou pode ser real, como duas compras iguais no mesmo dia. Toque para abrir ' +
          'o grupo e ver uma por uma.'));

        var caixaRep = no('div');
        rep.appendChild(caixaRep);
        var pagRep = 0;
        var POR_PAGINA_REP = 10;
        var abertos = {};

        function desenharRepetidos() {
          var paginas = Math.max(1, Math.ceil(grupos.length / POR_PAGINA_REP));
          pagRep = Math.min(Math.max(pagRep, 0), paginas - 1);
          var de = pagRep * POR_PAGINA_REP;
          var ate = Math.min(de + POR_PAGINA_REP, grupos.length);
          caixaRep.textContent = '';

          function barra() {
            var b = no('div', 'paginas');
            var antes = botao('btn-mini', '‹ Anteriores', function () { pagRep--; desenharRepetidos(); });
            antes.disabled = pagRep === 0;
            var depois = botao('btn-mini', 'Próximos ›', function () { pagRep++; desenharRepetidos(); });
            depois.disabled = pagRep >= paginas - 1;
            juntar(b, antes,
              no('span', 'paginas-conta', (de + 1) + '–' + ate + ' de ' + grupos.length + ' grupos'),
              depois);
            return b;
          }

          if (paginas > 1) caixaRep.appendChild(barra());

          grupos.slice(de, ate).forEach(function (g, i) {
            var chave = de + i;
            var aberto = !!abertos[chave];
            // O grupo abre em vez de pular direto para um lançamento: com
            // duas iguais, ninguém sabe qual delas abriu.
            var l = botao('linha', null, function () {
              abertos[chave] = !aberto;
              desenharRepetidos();
            });
            juntar(l,
              selo('#F87171', String(g.length)),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', g[0].descricao || g[0].categoria),
                no('div', 'linha-sub', dataBr(g[0].data) + ' · ' + g.length + ' vezes')),
              juntar(no('div', 'linha-fim'),
                no('div', 'linha-valor num', emReais(g[0].valor)),
                no('div', 'linha-sub', aberto ? 'fechar ▴' : 'ver ▾')));
            caixaRep.appendChild(l);

            if (!aberto) return;
            var dentro = no('div', 'grupo-aberto');
            g.forEach(function (l2, k) {
              // Duas iguais ficariam com a mesma cara. O que separa uma da
              // outra é de onde ela veio: qual arquivo, ou quando entrou.
              var deOnde = '';
              (estado.importacoes || []).forEach(function (imp) {
                if (imp.id === l2.importacaoId) deOnde = imp.arquivo || imp.banco || 'extrato importado';
              });
              if (!deOnde) deOnde = l2.importacaoId ? 'extrato importado' : 'lançado à mão';
              var b = botao('linha', null, function () { abrirFolhaLancamento(l2.id); });
              juntar(b,
                selo('#8A7A55', String(k + 1)),
                juntar(no('div', 'linha-texto'),
                  no('div', 'linha-titulo', l2.descricao || l2.categoria),
                  no('div', 'linha-sub', l2.categoria + ' · ' + deOnde),
                  no('div', 'linha-nota', 'entrou em ' + quandoEntrou(l2.criadoEm))),
                no('div', 'linha-valor num', emReais(l2.valor)));
              dentro.appendChild(b);
            });
            caixaRep.appendChild(dentro);
          });

          if (paginas > 1) caixaRep.appendChild(barra());
        }
        desenharRepetidos();
        forma.appendChild(rep);
      }

      // ---- importações desta conta ----
      var minhas = (estado.importacoes || []).filter(function (i) { return i.contaId === id; })
        .sort(function (a, b) { return b.quando - a.quando; });
      var imp = cartao('liso');
      imp.appendChild(no('div', 'rotulo', 'Extratos importados'));
      if (!minhas.length) {
        imp.appendChild(no('div', 'linha-nota',
          'Nenhuma importação registrada nesta conta. Extratos importados antes desta versão ' +
          'não aparecem aqui, mas os lançamentos deles continuam na lista.'));
      } else {
        imp.appendChild(no('div', 'linha-nota',
          'Se uma leitura saiu errada, dá para tirar a leva inteira sem mexer no resto.'));
        minhas.forEach(function (i) {
          var linha = no('div', 'linha');
          var sub = i.quantos + ' lançamento(s)' +
            (i.de ? ' · ' + dataBr(i.de) + ' a ' + dataBr(i.ate) : '');
          juntar(linha,
            juntar(no('div', 'linha-texto'),
              no('div', 'linha-titulo', i.arquivo || i.banco || 'Extrato'),
              no('div', 'linha-sub', sub)),
            botao('btn-mini', 'Tirar', function () {
              desfazerImportacao(i.id, function () {
                fecharFolha();
                setTimeout(function () { abrirFolhaConferencia(id); }, 240);
              });
            }));
          imp.appendChild(linha);
          if (i.saldoExtrato != null) {
            imp.appendChild(no('div', 'linha-nota',
              'O extrato terminava com saldo de ' + emReais(i.saldoExtrato) + '.'));
          }
        });
      }
      forma.appendChild(imp);

      // ---- recomeçar do zero ----
      // Extrato importado errado antes de existir o registro de importações
      // só sai assim. É perigoso, então fica no fim e pergunta duas vezes.
      if (r.quantos) {
        var zerar = cartao('liso');
        zerar.appendChild(no('div', 'rotulo', 'Recomeçar esta conta'));
        zerar.appendChild(no('div', 'linha-nota',
          'Apaga os ' + r.quantos + ' lançamento(s) desta conta e devolve o saldo inicial a zero. ' +
          'Serve quando um extrato entrou todo errado e você quer importar de novo do começo. ' +
          'As outras contas não são tocadas.'));
        var bZerar = botao('btn btn-vermelho', 'Apagar tudo desta conta', function () {
          perguntar({
            titulo: 'Apagar tudo desta conta?',
            texto: 'Vão embora ' + r.quantos + ' lançamento(s) de "' + conta.nome + '", ' +
                   'incluindo transferências que envolvam ela. Isso não tem volta — se quiser ' +
                   'guardar antes, faça um backup em Mais.',
            ok: 'Apagar tudo', tom: 'perigo'
          }, function () {
            var idos = 0;
            estado.lancamentos = estado.lancamentos.filter(function (l) {
              if (l.contaId !== id && l.contaDestinoId !== id) return true;
              marcarExcluido('lancamentos', l.id);
              idos++;
              return false;
            });
            estado.importacoes = (estado.importacoes || []).filter(function (i) { return i.contaId !== id; });
            conta.saldoInicial = 0;
            salvar();
            avisar(idos + ' lançamento(s) apagados.');
            fecharFolha();
            setTimeout(function () { abrirFolhaConferencia(id); }, 240);
          });
        });
        bZerar.style.marginTop = '10px';
        zerar.appendChild(bZerar);
        forma.appendChild(zerar);
      }

      folha.appendChild(forma);
    });
  }

  function abrirExtratoConta(id) {
    var conta = achar(estado.contas, id);
    if (!conta) return;

    abrirFolha(conta.nome, function (folha) {
      var saldo = saldoConta(id, null);

      var topo = cartao();
      topo.appendChild(no('div', 'rotulo', 'Saldo atual'));
      topo.appendChild(no('div', 'valorao num' + (saldo < 0 ? ' vermelho' : ''), emReais(saldo)));
      topo.appendChild(no('div', 'linha-nota', conta.tipo + ' · saldo inicial de ' + emReais(conta.saldoInicial)));

      var conferir = botao('btn btn-ouro', 'Conferir esta conta', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaConferencia(id); }, 240);
      });
      conferir.style.marginTop = '14px';
      topo.appendChild(conferir);

      var editar = botao('btn btn-fantasma', 'Editar esta conta', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaConta(id); }, 240);
      });
      editar.style.marginTop = '8px';
      topo.appendChild(editar);
      folha.appendChild(topo);

      var itens = lancamentosDaConta(id);
      if (!itens.length) {
        var vazio = cartao('liso');
        vazio.appendChild(estadoVazio('Nenhum movimento ainda',
          'Os lançamentos feitos nesta conta aparecem aqui, do mais recente para o mais antigo.'));
        folha.appendChild(vazio);
        return;
      }

      var porDia = {};
      var ordem = [];
      itens.forEach(function (l) {
        if (!porDia[l.data]) { porDia[l.data] = []; ordem.push(l.data); }
        porDia[l.data].push(l);
      });

      ordem.forEach(function (data) {
        var doDia = porDia[data];
        var totalDia = doDia.reduce(function (soma, l) { return soma + efeitoNaConta(l, id); }, 0);

  // ---------- Análises calculadas ----------

  function normalizar(descricao) {
    return descricao.toLowerCase().replace(/\d+/g, '').replace(/[^a-zà-ú ]/gi, '').trim();
  }

  // Só categorias em que faz sentido sugerir corte: aluguel e imposto não se cancela.
  var CANCELAVEIS = ['Assinaturas', 'Lazer', 'Educação', 'Alimentação', 'Outros'];

  function assinaturasProvaveis() {
    var grupos = {};
    estado.lancamentos.forEach(function (l) {
      if (l.tipo !== 'saida' || !l.descricao) return;
      if (CANCELAVEIS.indexOf(l.categoria) < 0) return;
      var chave = normalizar(l.descricao) + '|' + l.valor;
      if (!chave.trim()) return;
      (grupos[chave] = grupos[chave] || []).push(l);
    });

    var achados = [];
    Object.keys(grupos).forEach(function (chave) {
      var itens = grupos[chave];
      var meses = {};
      itens.forEach(function (l) { meses[l.data.slice(0, 7)] = true; });
      if (Object.keys(meses).length >= 2) {
        achados.push({ descricao: itens[0].descricao, valor: itens[0].valor, vezes: Object.keys(meses).length });
      }
    });
    return achados.sort(function (a, b) { return b.valor - a.valor; });
  }

  function gerarAnalises() {
    var lista = [];
    var ant = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
    var atual = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);
    var anterior = gastosPorCategoria(ant.ano, ant.mes);
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);

    var mapaAnterior = {};
    anterior.lista.forEach(function (c) { mapaAnterior[c.nome] = c.valor; });

    // Maior queda e maior alta por categoria
    var quedas = [], altas = [];
    atual.lista.forEach(function (c) {
      var base = mapaAnterior[c.nome];
      if (!base) return;
      var dif = c.valor - base;
      var p = (dif / base) * 100;
      if (p <= -8) quedas.push({ nome: c.nome, p: p, dif: dif });
      if (p >= 8) altas.push({ nome: c.nome, p: p, dif: dif });
    });
    quedas.sort(function (a, b) { return a.p - b.p; });
    altas.sort(function (a, b) { return b.p - a.p; });

    if (quedas.length) {
      var q = quedas[0];
      lista.push({
        tom: 'bom', pino: '↓', cor: 'var(--verde)', titulo: 'Boa!',
        texto: 'Seus gastos com ' + q.nome.toLowerCase() + ' caíram ' +
          Math.abs(q.p).toFixed(0) + '% em ' + MESES[mesAtivo.mes] + ' comparado ao mês anterior.',
        destaque: 'Economia de ' + emReais(-q.dif), destaqueCor: 'var(--verde)'
      });
    }

    if (altas.length) {
      var a = altas[0];
      lista.push({
        tom: 'atencao', pino: '!', cor: 'var(--ouro)', titulo: 'Atenção',
        texto: 'Seus gastos com ' + a.nome.toLowerCase() + ' subiram ' +
          a.p.toFixed(0) + '% em relação ao mês anterior.',
        destaque: 'Aumento de ' + emReais(a.dif), destaqueCor: 'var(--vermelho)'
      });
    }

    var assinaturas = assinaturasProvaveis();
    if (assinaturas.length) {
      var somaAss = assinaturas.reduce(function (s, x) { return s + x.valor; }, 0);
      lista.push({
        tom: 'oportunidade', pino: '◇', cor: 'var(--ouro)', titulo: 'Oportunidade',
        texto: 'Encontramos ' + assinaturas.length + ' cobrança(s) que se repetem todo mês: ' +
          assinaturas.slice(0, 4).map(function (x) { return x.descricao; }).join(', ') +
          '. Cancelar o que você não usa libera esse valor.',
        destaque: 'Até ' + emReais(somaAss) + ' por mês', destaqueCor: 'var(--roxo)'
      });
    }

    if (t.entradas > 0) {
      var taxa = ((t.entradas - t.saidas) / t.entradas) * 100;
      lista.push({
        tom: taxa >= 20 ? 'bom' : 'atencao',
        pino: '%', cor: taxa >= 20 ? 'var(--verde)' : 'var(--ouro)',
        titulo: taxa >= 20 ? 'Boa taxa de poupança' : 'Sobra apertada',
        texto: 'Você guardou ' + taxa.toFixed(0) + '% do que entrou em ' + MESES[mesAtivo.mes] +
          '. ' + (taxa >= 20 ? 'Acima dos 20% que costumam ser recomendados.' : 'O caminho comum é buscar pelo menos 20%.'),
        destaque: comSinal(t.saldo), destaqueCor: t.saldo >= 0 ? 'var(--verde)' : 'var(--vermelho)'
      });
    }

    estado.metas.forEach(function (m) {
      var p = pct(m.guardado, m.alvo);
      if (p >= 50) {
        lista.push({
          tom: 'meta', pino: '◎', cor: 'var(--verde)', titulo: 'Meta em dia',
          texto: 'Sua meta ' + m.nome + ' está ' + Math.round(p) + '% completa. Faltam ' +
            emReais(Math.max(0, m.alvo - m.guardado)) + '.',
          destaque: null
        });
      }
    });

    if (atual.total > 0) {
      var maior = atual.lista[0];
      lista.push({
        tom: 'info', pino: '★', cor: 'var(--ouro)', titulo: 'Maior gasto do mês',
        texto: maior.nome + ' concentrou ' + Math.round(pct(maior.valor, atual.total)) +
          '% das suas saídas, somando ' + emReais(maior.valor) + '.',
        destaque: null
      });
    }

    if (!lista.length) {
      lista.push({
        tom: 'info', pino: '·', cor: 'var(--suave)', titulo: 'Ainda sem padrões',
        texto: 'Registre lançamentos por alguns meses para eu comparar períodos e apontar tendências.',
        destaque: null
      });
    }

    return lista;
  }

    [

  // Calendário de verdade no lugar do input de data: o ano rola de lado em
  // cima, os meses rolam de lado embaixo, e o dia é um toque. Expõe .value
  // como o input antigo, então quem usava continua usando igual.
  var DIAS_CURTOS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

  function calendarioData(valor, rotulo, aoMudar) {
    var caixa = no('div');
    var escolhido = ehData(valor) ? valor : hojeTexto();
    var p = partes(escolhido);
    var anoVisto = p.ano, mesVisto = p.mes;

    var cabecalho = no('div', 'cal-rotulo');
    cabecalho.appendChild(no('span', 'rotulo', rotulo));
    var lido = no('span', 'num');
    cabecalho.appendChild(lido);
    caixa.appendChild(cabecalho);

    var cal = no('div', 'cal');
    caixa.appendChild(cal);

    var fitaAno = no('div', 'cal-fita');
    var textoAno = no('div', 'cal-ano');
    fitaAno.appendChild(botao('cal-seta', '‹', function () { mudarAno(-1); }));
    fitaAno.appendChild(textoAno);
    fitaAno.appendChild(botao('cal-seta', '›', function () { mudarAno(1); }));
    cal.appendChild(fitaAno);

    var fitaMes = no('div', 'cal-fita');
    var textoMes = no('div', 'cal-mes');
    fitaMes.appendChild(botao('cal-seta', '‹', function () { mudarMes(-1); }));
    fitaMes.appendChild(textoMes);
    fitaMes.appendChild(botao('cal-seta', '›', function () { mudarMes(1); }));
    cal.appendChild(fitaMes);

    var grade = no('div', 'cal-grade');
    cal.appendChild(grade);

    function mudarAno(n) { anoVisto += n; desenharCal(); }
    function mudarMes(n) {
      mesVisto += n;
      while (mesVisto > 11) { mesVisto -= 12; anoVisto++; }
      while (mesVisto < 0) { mesVisto += 12; anoVisto--; }
      desenharCal();
    }

    // Arrastar de lado: no ano muda o ano, no resto muda o mês.
    function arrastar(alvo, aoLado) {
      var x0 = null, y0 = null;
      alvo.addEventListener('touchstart', function (e) {
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      }, { passive: true });
      alvo.addEventListener('touchend', function (e) {
        if (x0 == null) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - x0, dy = t.clientY - y0;
        x0 = null;
        if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.5) aoLado(dx < 0 ? 1 : -1);
      }, { passive: true });
    }
    arrastar(fitaAno, mudarAno);
    arrastar(grade, mudarMes);
    arrastar(fitaMes, mudarMes);

    function desenharCal() {
      textoAno.textContent = String(anoVisto);
      textoMes.textContent = MESES[mesVisto];
      lido.textContent = dataBr(escolhido);
      grade.textContent = '';
      DIAS_CURTOS.forEach(function (d) { grade.appendChild(no('div', 'cal-cab', d)); });

      var primeiro = new Date(anoVisto, mesVisto, 1);
      var vazios = primeiro.getDay();
      var noMes = new Date(anoVisto, mesVisto + 1, 0).getDate();
      var doAnterior = new Date(anoVisto, mesVisto, 0).getDate();
      var hoje = hojeTexto();

      for (var i = 0; i < 42; i++) {
        var dia, mes = mesVisto, ano = anoVisto, fora = false;
        if (i < vazios) { dia = doAnterior - vazios + 1 + i; mes--; fora = true; }
        else if (i - vazios < noMes) { dia = i - vazios + 1; }
        else { dia = i - vazios - noMes + 1; mes++; fora = true; }
        if (mes < 0) { mes = 11; ano--; }
        if (mes > 11) { mes = 0; ano++; }
        if (i >= vazios + noMes && i >= 35) break;

        var texto = textoDeData(ano, mes, dia);
        var classes = 'cal-dia' + (fora ? ' fora' : '') +
          (texto === escolhido ? ' escolhido' : '') + (texto === hoje ? ' hoje' : '');
        grade.appendChild(botao(classes, String(dia), (function (t) {
          return function () {
            escolhido = t;
            var q = partes(t);
            anoVisto = q.ano; mesVisto = q.mes;
            desenharCal();
            if (aoMudar) aoMudar(t);
          };
        })(texto)));
      }
    }

    desenharCal();
    Object.defineProperty(caixa, 'value', {
      get: function () { return escolhido; },
      set: function (v) {
        if (!ehData(v)) return;
        escolhido = v;
        var q = partes(v);
        anoVisto = q.ano; mesVisto = q.mes;
        desenharCal();
      }
    });
    return caixa;
  }

  // Um campo de escolha com a cara do app. Expõe .value como um <select>,
  // então quem já usava continua usando do mesmo jeito.
  // Número escrito à mão, com vírgula ou ponto. Nada de type=number: no
  // celular ele engole o que a pessoa digita quando o formato não bate.
  function entradaTextoNumero(valor, dica) {
    var i = no('input', 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.inputMode = 'decimal';
    i.autocomplete = 'off';
    i.value = String(valor == null ? '' : valor).replace('.', ',');
    if (dica) i.placeholder = dica;
    i.addEventListener('input', function () {
      var limpo = i.value.replace(/[^0-9.,]/g, '').replace(/[.,]/g, function (m, pos, todo) {
        return todo.slice(0, pos).search(/[.,]/) >= 0 ? '' : ',';
      });
      if (limpo !== i.value) i.value = limpo;
    });
    return i;
  }

  function entradaSelecao(opcoes, valor, titulo) {
    var b = no('button', 'entrada selecao');

    var rotulo = no('span', 'rotulo-valor');
    var seta = no('span', 'seta', '▾');
    juntar(b, rotulo, seta);

    function achou() {
      for (var i = 0; i < lista.length; i++) if (lista[i].valor === atual) return lista[i];
      return lista[0] || null;
    }

    function pintar() {
      var op = achou();
      rotulo.textContent = op ? op.rotulo : '';
      rotulo.style.color = op && op.valor === '' ? 'var(--fraco)' : '';
    }

    b.addEventListener('click', function () {
      b.setAttribute('aria-expanded', 'true');
      abrirEscolha({
        titulo: titulo || 'Escolha',
        opcoes: lista,
        valor: atual
      }, function (escolhido) {
        b.setAttribute('aria-expanded', 'false');
        if (escolhido == null) return;
        atual = escolhido;
        pintar();
        if (typeof b.aoMudar === 'function') b.aoMudar(atual);
      });
    });

    Object.defineProperty(b, 'value', {
      get: function () { var op = achou(); return op ? op.valor : ''; },
      set: function (v) { atual = v; pintar(); }
    });
    b.trocarOpcoes = function (novas, novoValor) {
      lista = novas.slice();
      if (novoValor !== undefined) atual = novoValor;
      pintar();
    };
    pintar();
    return b;
  }

  // Mostra (51) 98501-9255 enquanto a pessoa digita, mas guarda só os números.
  function entradaTelefone(valor) {
    var i = no('input', 'entrada');
    i.type = 'tel';
    i.id = proximoId();
    i.inputMode = 'tel';
    i.autocomplete = 'tel';
    i.placeholder = '(51) 90000-0000';
    i.value = telefoneBonito(valor);

    function fim() {
      var n = i.value.length;
      if (i.selectionStart === n && i.selectionEnd === n) return;
      try { i.setSelectionRange(n, n); } catch (e) { /* alguns navegadores recusam */ }
    }

    i.addEventListener('input', function () {
      i.value = telefoneBonito(i.value);
      fim();
    });
    ['focus', 'click', 'select', 'keyup'].forEach(function (ev) { i.addEventListener(ev, fim); });
    return i;
  }

  function entradaValor(centavos, grande) {
    var i = no('input', grande ? 'valor-grande' : 'entrada');
    i.type = 'text';
    i.id = proximoId();
    i.inputMode = 'numeric';
    i.autocomplete = 'off';
    i.value = emReais(centavos || 0);

    function fim() {
      var n = i.value.length;
      if (i.selectionStart === n && i.selectionEnd === n) return;
      try { i.setSelectionRange(n, n); } catch (e) { /* alguns navegadores recusam */ }
    }

    i.addEventListener('input', function () {
      i.value = emReais(digitosParaCentavos(i.value));
      fim();
    });
    ['focus', 'click', 'select', 'keyup'].forEach(function (ev) { i.addEventListener(ev, fim); });
    return i;
  }

  function grupoChips(opcoes, selecionado, aoEscolher) {
    var caixa = no('div', 'chips');
    caixa.setAttribute('role', 'group');
    opcoes.forEach(function (op) {
      var c = botao('chip', op, function () {
        Array.prototype.forEach.call(caixa.children, function (outro) {
          outro.setAttribute('aria-pressed', outro === c ? 'true' : 'false');
        });
        aoEscolher(op);
      });
      c.setAttribute('aria-pressed', op === selecionado ? 'true' : 'false');
      caixa.appendChild(c);
    });
    return caixa;
  }

  function opcoesDeConta() {
    return estado.contas.map(function (c) { return { valor: c.id, rotulo: c.nome }; });
  }

  function mostrarErro(caixa, mensagem) {
    var antigo = caixa.querySelector('.erro');
    if (antigo) antigo.remove();
    var e = no('p', 'erro', mensagem);
    caixa.appendChild(e);
  }

  // ---------- Sugestão de categoria ----------

  function sugerirCategoria(descricao, tipo) {
    var texto = descricao.toLowerCase().trim();
    if (!texto) return null;

    // 1) Descrição igual a algo já lançado antes
    var iguais = estado.lancamentos.filter(function (l) {
      return l.tipo === tipo && l.descricao && l.descricao.toLowerCase().trim() === texto;
    });
    if (iguais.length) return iguais[iguais.length - 1].categoria;

    // 2) Palavras conhecidas
    for (var i = 0; i < PISTAS.length; i++) {
      var categoria = PISTAS[i][0];
      if (categoriasDe(tipo).indexOf(categoria) < 0) continue;
      var palavras = PISTAS[i][1];
      for (var j = 0; j < palavras.length; j++) {
        if (texto.indexOf(palavras[j]) >= 0) return categoria;
      }
    }
    return null;
  }

  // ---------- Folha: lançamento ----------

  function abrirFolhaLancamento(id, rascunho) {
    var existente = id ? achar(estado.lancamentos, id) : null;
    if (id && !existente) return;

    contaPadrao();

    var dados = rascunho || (existente ? {
      tipo: existente.tipo,
      valor: existente.valor,
      descricao: existente.descricao,
      categoria: existente.categoria,
      data: existente.data,
      contaId: existente.contaId || estado.contas[0].id,
      contaDestinoId: existente.contaDestinoId || ''
    } : {
      tipo: 'saida',
      valor: 0,
      descricao: '',
      categoria: 'Outros',
      data: dataPadrao(),
      contaId: estado.contas[0].id,
      contaDestinoId: estado.contas.length > 1 ? estado.contas[1].id : ''
    });

    var categoriaTocada = rascunho ? !!rascunho.categoriaTocada : !!existente;

    abrirFolha(existente ? 'Editar lançamento' : 'Novo lançamento', function (folha) {
      var forma = no('div', 'forma');
      forma.setAttribute('data-tipo', dados.tipo);

      var tipos = segmentos([
        { valor: 'saida', rotulo: 'Saída' },
        { valor: 'entrada', rotulo: 'Entrada' },
        { valor: 'transferencia', rotulo: 'Transferência' }
      ], dados.tipo, function (v) {
        if (v === dados.tipo) return;
        var novo = coletar();
        novo.tipo = v;
        novo.categoriaTocada = categoriaTocada;
        if (v !== 'transferencia' && categoriasDe(v).indexOf(novo.categoria) < 0) novo.categoria = 'Outros';
        abrirFolhaLancamento(id, novo);
      });
      forma.appendChild(tipos);

      var campoValorEl = entradaValor(dados.valor, true);
      forma.appendChild(campo('Valor', campoValorEl));

      var campoDescricao = entradaTexto(dados.descricao,
        dados.tipo === 'transferencia' ? 'Ex.: Reserva para o mês' : 'Ex.: Abastecimento no posto');
      forma.appendChild(campo('Descrição', campoDescricao));

      var caixaChips = null;
      if (dados.tipo !== 'transferencia') {
        caixaChips = grupoChips(categoriasDe(dados.tipo), dados.categoria, function (c) {
          dados.categoria = c;
          categoriaTocada = true;
        });
        forma.appendChild(campo('Categoria', caixaChips));

        campoDescricao.addEventListener('input', function () {
          if (categoriaTocada) return;
          var sugerida = sugerirCategoria(campoDescricao.value, dados.tipo);
          if (!sugerida || sugerida === dados.categoria) return;
          dados.categoria = sugerida;
          Array.prototype.forEach.call(caixaChips.children, function (chip) {
            chip.setAttribute('aria-pressed', chip.textContent === sugerida ? 'true' : 'false');
          });
        });
      }

      var campoConta = entradaSelecao(opcoesDeConta(), dados.contaId);
      forma.appendChild(campo(dados.tipo === 'transferencia' ? 'De qual conta' : 'Conta', campoConta));

      var campoDestino = null;
      if (dados.tipo === 'transferencia') {
        campoDestino = entradaSelecao(opcoesDeConta(), dados.contaDestinoId);
        forma.appendChild(campo('Para qual conta', campoDestino));
      }

      var campoData = entradaData(dados.data);
      forma.appendChild(campo('Data', campoData));

      function coletar() {
        return {
          tipo: dados.tipo,
          valor: digitosParaCentavos(campoValorEl.value),
          descricao: campoDescricao.value,
          categoria: dados.categoria,
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: campoDestino ? campoDestino.value : dados.contaDestinoId
        };
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe um valor maior que zero.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }
        if (dados.tipo === 'transferencia') {
          if (!campoDestino.value || campoDestino.value === campoConta.value) {
            mostrarErro(forma, 'Escolha duas contas diferentes para a transferência.');
            return;
          }
        }

        var registro = {
          id: existente ? existente.id : novoId(),
          tipo: dados.tipo,
          valor: valor,
          descricao: campoDescricao.value.trim(),
          categoria: dados.tipo === 'transferencia' ? 'Transferência' : dados.categoria,
          data: campoData.value,
          contaId: campoConta.value,
          contaDestinoId: dados.tipo === 'transferencia' ? campoDestino.value : '',
          criadoEm: existente ? existente.criadoEm : Date.now()
        };

        if (existente) {
          estado.lancamentos = estado.lancamentos.map(function (l) { return l.id === existente.id ? registro : l; });
        } else {
          estado.lancamentos.push(registro);
        }

        salvar();
        var p = partes(registro.data);
        mesAtivo = { ano: p.ano, mes: p.mes };
        fecharFolha();
        desenhar();
        avisar(existente ? 'Lançamento atualizado.' : 'Lançamento salvo.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir lançamento', function () {
          perguntar({
            titulo: 'Excluir este lançamento?',
            texto: 'Não dá para desfazer.',
            ok: 'Excluir lançamento', tom: 'perigo'
          }, function () {
            marcarExcluido('lancamentos', existente.id);
            estado.lancamentos = estado.lancamentos.filter(function (l) { return l.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar('Lançamento excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);

      setTimeout(function () { campoValorEl.focus(); }, 270);
    });
  }

  function dataPadrao() {
    var hoje = new Date();
    if (hoje.getFullYear() === mesAtivo.ano && hoje.getMonth() === mesAtivo.mes) return hojeTexto();
    return textoDeData(mesAtivo.ano, mesAtivo.mes, 1);
  }

  // ---------- Folha: conta ----------

  function abrirFolhaConta(id, nasceCartao) {
    var existente = id ? achar(estado.contas, id) : null;
    if (id && !existente) return;
    var cor = existente ? existente.cor : CORES[estado.contas.length % CORES.length];
    var chaveBanco = existente ? (existente.banco || '') : '';
    var ehNovoCartao = !existente && nasceCartao;

    var titulo = existente ? (ehCartao(existente) ? 'Editar cartão' : 'Editar conta')
                           : (ehNovoCartao ? 'Novo cartão' : 'Nova conta');

    abrirFolha(titulo, function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Nubank', 40);
      forma.appendChild(campo('Nome', campoNome));

      // Banco: escolher aqui já traz a cor e a marca.
      var linhaBanco = no('div', 'linha-dupla-campo');
      var campoBanco = entradaSelecao(
        [{ valor: '', rotulo: 'Nenhum / outro' }].concat(
          Extrato.listaDeBancos().map(function (b) { return { valor: b.chave, rotulo: b.nome }; })),
        chaveBanco, 'De qual banco?');
      campoBanco.aoMudar = function (v) {
        chaveBanco = v;
        var b = v ? Extrato.bancoPorChave(v) : null;
        if (b) {
          cor = b.cor;
          if (!campoNome.value.trim()) campoNome.value = b.nome;
          pintarPaleta();
        }
      };
      linhaBanco.appendChild(campoBanco);
      forma.appendChild(campo('Banco', linhaBanco));

      var campoTipo = entradaSelecao(TIPOS_CONTA.map(function (t) {
        return { valor: t, rotulo: t };
      }), existente ? existente.tipo : (ehNovoCartao ? 'Cartão de crédito' : 'Conta corrente'));
      campoTipo.aoMudar = function () { mostrarCamposDeCartao(); };
      forma.appendChild(campo('Tipo', campoTipo));

      var campoSaldo = entradaValor(existente ? existente.saldoInicial : 0, false);
      var caixaSaldo = campo('Saldo inicial', campoSaldo);
      forma.appendChild(caixaSaldo);
      var nota = no('div', 'linha-nota', 'O saldo atual é este valor mais os lançamentos desta conta.');
      nota.style.marginTop = '-8px';
      nota.style.marginBottom = '14px';
      forma.appendChild(nota);

      // Fechamento e vencimento: só fazem sentido em cartão de crédito.
      var caixaDias = no('div', 'duas');
      var campoFecha = entradaSelecao(diasDoMes('Sem dia certo'),
        String(existente && existente.fechamento ? existente.fechamento : ''), 'Fecha no dia');
      var campoVence = entradaSelecao(diasDoMes('Sem dia certo'),
        String(existente && existente.vencimento ? existente.vencimento : ''), 'Vence no dia');
      caixaDias.appendChild(campo('Fecha no dia', campoFecha));
      caixaDias.appendChild(campo('Vence no dia', campoVence));
      forma.appendChild(caixaDias);
      var notaCartao = no('div', 'linha-nota',
        'Com o dia de fechamento eu separo os gastos por fatura. Sem ele, uso o mês do lançamento.');
      notaCartao.style.marginTop = '-8px';
      notaCartao.style.marginBottom = '14px';
      forma.appendChild(notaCartao);

      function mostrarCamposDeCartao() {
        var cartao = campoTipo.value === 'Cartão de crédito';
        caixaDias.hidden = !cartao;
        notaCartao.hidden = !cartao;
        nota.hidden = cartao;
        caixaSaldo.hidden = cartao;
      }
      mostrarCamposDeCartao();

      var paleta = no('div', 'chips');
      function pintarPaleta() {
        paleta.textContent = '';
        // A cor da marca do banco entra na paleta, senão ela sumiria na
        // primeira vez que a pessoa abrisse a conta para editar.
        var cores = CORES.slice();
        if (cores.indexOf(cor) < 0) cores.unshift(cor);
        cores.forEach(function (c) {
          var b = botao('chip', ' ', function () {
            cor = c;
            Array.prototype.forEach.call(paleta.children, function (outro) {
              outro.setAttribute('aria-pressed', outro === b ? 'true' : 'false');
            });
          });
          b.style.background = c;
          b.style.borderColor = c;
          b.style.width = '38px';
          b.setAttribute('aria-pressed', c === cor ? 'true' : 'false');
          b.setAttribute('aria-label', 'Cor ' + c);
          paleta.appendChild(b);
        });
      }
      pintarPaleta();
      forma.appendChild(campo('Cor', paleta));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Dê um nome para a conta.'); return; }

        var cartaoAgora = campoTipo.value === 'Cartão de crédito';
        var fecha = inteiro(campoFecha.value);
        var vence = inteiro(campoVence.value);

        if (existente) {
          existente.nome = nome;
          existente.tipo = campoTipo.value;
          existente.saldoInicial = cartaoAgora ? 0 : digitosParaCentavos(campoSaldo.value);
          existente.cor = cor;
          existente.banco = chaveBanco;
          existente.fechamento = cartaoAgora ? fecha : 0;
          existente.vencimento = cartaoAgora ? vence : 0;
        } else {
          estado.contas.push({
            id: novoId(), nome: nome, tipo: campoTipo.value,
            saldoInicial: cartaoAgora ? 0 : digitosParaCentavos(campoSaldo.value), cor: cor,
            banco: chaveBanco,
            fechamento: cartaoAgora ? fecha : 0,
            vencimento: cartaoAgora ? vence : 0
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Conta atualizada.' : 'Conta criada.');
      }));

      if (existente) {
        var eraCartao = ehCartao(existente);
        var palavra = eraCartao ? 'cartão' : 'conta';

        acoes.appendChild(botao('btn btn-perigo', 'Excluir ' + palavra, function () {
          var presos = estado.lancamentos.filter(function (l) {
            return l.contaId === existente.id || l.contaDestinoId === existente.id;
          });

          function apagarDeVez() {
            // Os lançamentos vão junto: sem a conta eles ficariam soltos,
            // sem saldo e sem aparecer em lugar nenhum.
            presos.forEach(function (l) { marcarExcluido('lancamentos', l.id); });
            var fora = {};
            presos.forEach(function (l) { fora[l.id] = true; });
            estado.lancamentos = estado.lancamentos.filter(function (l) { return !fora[l.id]; });
            marcarExcluido('contas', existente.id);
            estado.contas = estado.contas.filter(function (c) { return c.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar(eraCartao ? 'Cartão excluído.' : 'Conta excluída.');
          }

          if (!presos.length) {
            perguntar({
              titulo: 'Excluir ' + (eraCartao ? 'o cartão ' : 'a conta ') + existente.nome + '?',
              texto: 'Ele some das telas e dos relatórios.',
              ok: 'Excluir ' + palavra, tom: 'perigo'
            }, apagarDeVez);
            return;
          }

          perguntar({
            titulo: 'Excluir ' + (eraCartao ? 'o cartão ' : 'a conta ') + existente.nome + '?',
            texto: 'Tem ' + presos.length + ' lançamento(s) aqui dentro. Eles serão apagados junto — ' +
                   'inclusive os que vieram da fatura importada. Isso não tem volta.',
            ok: 'Excluir com os lançamentos', tom: 'perigo'
          }, apagarDeVez);
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: ativo ----------

  function abrirFolhaAtivo(id) {
    var existente = id ? achar(estado.ativos, id) : null;
    if (id && !existente) return;
    var classe = existente ? existente.classe : 'Renda Fixa';

    abrirFolha(existente ? 'Editar ativo' : 'Novo ativo', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Tesouro Selic 2029', 50);
      forma.appendChild(campo('Nome do ativo', campoNome));

      forma.appendChild(campo('Classe', grupoChips(CLASSES_ATIVO, classe, function (c) { classe = c; })));

      var campoAplicado = entradaValor(existente ? existente.aplicado : 0, false);
      forma.appendChild(campo('Valor aplicado', campoAplicado));

      var campoAtual = entradaValor(existente ? valorAtivo(existente) : 0, false);
      forma.appendChild(campo('Valor atual', campoAtual));

      var nota = no('div', 'linha-nota',
        'Cada vez que você atualizar o valor atual, guardamos a data para montar o gráfico de evolução.');
      nota.style.marginTop = '-8px';
      nota.style.marginBottom = '14px';
      forma.appendChild(nota);

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Dê um nome para o ativo.'); return; }
        var atual = digitosParaCentavos(campoAtual.value);
        var aplicado = digitosParaCentavos(campoAplicado.value);
        var hoje = hojeTexto();

        if (existente) {
          existente.nome = nome;
          existente.classe = classe;
          existente.aplicado = aplicado;
          var ultimo = existente.historico[existente.historico.length - 1];
          if (ultimo && ultimo.data === hoje) ultimo.valor = atual;
          else existente.historico.push({ data: hoje, valor: atual });
        } else {
          estado.ativos.push({
            id: novoId(), nome: nome, classe: classe, aplicado: aplicado,
            historico: [{ data: hoje, valor: atual }]
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Ativo atualizado.' : 'Ativo cadastrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir ativo', function () {
          perguntar({
            titulo: 'Excluir ' + existente.nome + '?',
            texto: 'O histórico de valores desse ativo vai junto. Não dá para desfazer.',
            ok: 'Excluir ativo', tom: 'perigo'
          }, function () {
            marcarExcluido('ativos', existente.id);
            estado.ativos.forEach(function (a) {
              if (a.id === existente.id) a.historico.forEach(function (h) { marcarExcluido('ativo_historico', a.id + '|' + h.data); });
            });
            estado.ativos = estado.ativos.filter(function (a) { return a.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar('Ativo excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: meta ----------

  function abrirFolhaMeta(id) {
    var existente = id ? achar(estado.metas, id) : null;
    if (id && !existente) return;

    abrirFolha(existente ? 'Editar meta' : 'Nova meta', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Ex.: Viagem ao Japão', 50);
      forma.appendChild(campo('Nome', campoNome));

      var campoAlvo = entradaValor(existente ? existente.alvo : 0, false);
      forma.appendChild(campo('Quanto quer juntar', campoAlvo));

      var opcoesConta = [{ valor: '', rotulo: 'Nenhuma — eu digito o valor' }].concat(
        estado.contas.map(function (c) {
          return { valor: c.id, rotulo: c.nome, detalhe: emReais(saldoConta(c.id, null)) };
        }));
      var campoConta = entradaSelecao(opcoesConta,
        existente && existente.contaId ? existente.contaId : '', 'Conta da meta');
      forma.appendChild(campo('Qual conta guarda esse dinheiro (opcional)', campoConta));

      var campoGuardado = entradaValor(existente ? existente.guardado : 0, false);
      var caixaGuardado = campo('Já guardado', campoGuardado);
      forma.appendChild(caixaGuardado);

      var atalhos = no('div', 'chips');
      [5000, 10000, 20000, 50000].forEach(function (c) {
        atalhos.appendChild(botao('chip', '+ ' + emReais(c), function () {
          campoGuardado.value = emReais(digitosParaCentavos(campoGuardado.value) + c);
          pintarMeta();
        }));
      });
      var caixaAtalhos = campo('Adicionar rápido', atalhos);
      forma.appendChild(caixaAtalhos);

      var painelMeta = no('div', 'linha-nota');
      painelMeta.style.marginBottom = '14px';
      forma.appendChild(painelMeta);

      function pintarMeta() {
        var comConta = !!campoConta.value;
        caixaGuardado.style.display = comConta ? 'none' : '';
        caixaAtalhos.style.display = comConta ? 'none' : '';
        var alvoAgora = digitosParaCentavos(campoAlvo.value);
        var jaTem = comConta ? Math.max(saldoConta(campoConta.value, null), 0)
                             : digitosParaCentavos(campoGuardado.value);
        if (!alvoAgora) { painelMeta.textContent = ''; return; }
        painelMeta.textContent = emReais(jaTem) + ' de ' + emReais(alvoAgora) + ' — ' +
          Math.round(pct(jaTem, alvoAgora)) + '%' +
          (jaTem >= alvoAgora ? ', meta alcançada.' : ', faltam ' + emReais(alvoAgora - jaTem) + '.');
      }
      campoConta.aoMudar = pintarMeta;
      campoAlvo.addEventListener('input', pintarMeta);
      campoGuardado.addEventListener('input', pintarMeta);
      pintarMeta();

      var campoPrazo = entradaData(existente && existente.prazo ? existente.prazo : '');
      campoPrazo.value = existente ? existente.prazo : '';
      forma.appendChild(campo('Prazo (opcional)', campoPrazo));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        var alvo = digitosParaCentavos(campoAlvo.value);
        if (!nome) { mostrarErro(forma, 'Dê um nome para a meta.'); return; }
        if (alvo <= 0) { mostrarErro(forma, 'Informe quanto você quer juntar.'); return; }

        var registro = {
          id: existente ? existente.id : novoId(),
          nome: nome,
          alvo: alvo,
          guardado: digitosParaCentavos(campoGuardado.value),
          contaId: campoConta.value,
          prazo: ehData(campoPrazo.value) ? campoPrazo.value : ''
        };

        if (existente) estado.metas = estado.metas.map(function (m) { return m.id === existente.id ? registro : m; });
        else estado.metas.push(registro);

        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Meta atualizada.' : 'Meta criada.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir meta', function () {
          perguntar({
            titulo: 'Excluir a meta ' + existente.nome + '?',
            texto: 'O valor já guardado não é lançado de volta em nenhuma conta.',
            ok: 'Excluir meta', tom: 'perigo'
          }, function () {
            marcarExcluido('metas', existente.id);
            estado.metas = estado.metas.filter(function (m) { return m.id !== existente.id; });
            salvar();
            fecharFolha();
            desenhar();
            avisar('Meta excluída.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: orçamento ----------

  function gastoDaCategoria(nomeCat) {
    var total = 0;
    lancamentosDoMes(mesAtivo.ano, mesAtivo.mes).forEach(function (l) {
      if (l.tipo === 'saida' && l.categoria === nomeCat) total += l.valor;
    });
    return total;
  }

  function abrirFolhaOrcamento(rascunho) {
    var dados = rascunho || {
      geral: estado.orcamentos.geral,
      categorias: Object.keys(estado.orcamentos.categorias).map(function (c) {
        return { nome: c, valor: estado.orcamentos.categorias[c] };
      })
    };

    abrirFolha('Orçamento do mês', function (folha) {
      var forma = no('div');

      var campoGeral = entradaValor(dados.geral, false);
      forma.appendChild(campo('Teto de gastos do mês', campoGeral));

      var topo = no('div', 'cartao-topo');
      topo.style.marginBottom = '10px';
      juntar(topo,
        no('div', 'rotulo', 'Categorias'),
        botao('cartao-acao', dados.categorias.length ? 'Escolher' : '+ Escolher categorias', function () {
          dados.geral = digitosParaCentavos(campoGeral.value);
          lerValoresCategorias();
          empilhar({ tipo: 'aba', voltar: function () { abrirFolhaOrcamento(dados); } });
          abrirSeletorCategorias(dados);
        })
      );
      forma.appendChild(topo);

      var campos = {};
      function lerValoresCategorias() {
        dados.categorias.forEach(function (c) {
          if (campos[c.nome]) c.valor = digitosParaCentavos(campos[c.nome].value);
        });
      }

      if (!dados.categorias.length) {
        var vazio = no('p', 'linha-sub', 'Sem teto por categoria. Toque em "Escolher categorias" para separar quanto pode gastar em cada uma.');
        vazio.style.marginBottom = '8px';
        forma.appendChild(vazio);
      } else {
        dados.categorias.forEach(function (c) {
          var linha = no('div', 'orc-item');
          var rot = no('div', 'rot', c.nome);
          var gasto = gastoDaCategoria(c.nome);
          rot.appendChild(no('small', null, gasto > 0 ? 'gasto em ' + MESES[mesAtivo.mes] + ': ' + emReais(gasto) : 'sem gasto neste mês'));
          var entrada = entradaValor(c.valor, false);
          campos[c.nome] = entrada;
          var tirar = botao('tirar', '×', function () {
            lerValoresCategorias();
            dados.categorias = dados.categorias.filter(function (x) { return x.nome !== c.nome; });
            abrirFolhaOrcamento(dados);
          });
          tirar.setAttribute('aria-label', 'Tirar ' + c.nome);
          juntar(linha, rot, entrada, tirar);
          forma.appendChild(linha);
        });
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar orçamento', function () {
        lerValoresCategorias();
        estado.orcamentos.geral = digitosParaCentavos(campoGeral.value);
        estado.orcamentos.categorias = {};
        dados.categorias.forEach(function (c) {
          if (c.valor > 0) estado.orcamentos.categorias[c.nome] = c.valor;
        });
        salvar();
        fecharFolha();
        desenhar();
        avisar('Orçamento salvo.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function abrirSeletorCategorias(dados) {
    abrirFolha('Categorias', function (folha) {
      folha.appendChild(no('p', 'linha-sub', 'Marque as categorias que você quer limitar. O valor ao lado é o que já foi gasto em ' + MESES[mesAtivo.mes] + '.'));

      var lista = no('div', 'cartao liso');
      lista.style.marginTop = '14px';

      function estaMarcada(nomeCat) {
        return dados.categorias.some(function (c) { return c.nome === nomeCat; });
      }

      function desenharLista() {
        lista.textContent = '';
        categoriasDe('saida').forEach(function (nomeCat) {
          var gasto = gastoDaCategoria(nomeCat);
          var linha = botao('cat-linha', null, function () {
            if (estaMarcada(nomeCat)) {
              dados.categorias = dados.categorias.filter(function (c) { return c.nome !== nomeCat; });
            } else {
              dados.categorias.push({ nome: nomeCat, valor: gasto > 0 ? Math.ceil(gasto / 1000) * 1000 : 0 });
            }
            desenharLista();
          });
          linha.setAttribute('aria-pressed', estaMarcada(nomeCat) ? 'true' : 'false');
          juntar(linha,
            no('span', 'marca', estaMarcada(nomeCat) ? '✓' : ''),
            no('span', 'nome', nomeCat),
            no('span', 'gasto' + (gasto > 0 ? '' : ' zero'), gasto > 0 ? emReais(gasto) : '—')
          );
          lista.appendChild(linha);
        });

        var adicionar = botao('cat-linha', null, function () { abrirNovaCategoria(dados); });
        var maisMarca = no('span', 'marca');
        maisMarca.style.border = '0';
        maisMarca.style.color = 'var(--ouro)';
        maisMarca.appendChild(icone('mais', 18));
        juntar(adicionar, maisMarca, no('span', 'nome ouro', 'Adicionar categoria'));
        lista.appendChild(adicionar);
      }
      desenharLista();
      folha.appendChild(lista);

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Pronto', function () { voltarNavegacao(); }));
      folha.appendChild(acoes);
    });
  }

  function abrirNovaCategoria(dados) {
    empilhar({ tipo: 'aba', voltar: function () { abrirSeletorCategorias(dados); } });
    abrirFolha('Nova categoria', function (folha) {
      var forma = no('div');
      var campoNome = entradaTexto('', 'Ex.: Pet, Academia, Obra', 30);
      forma.appendChild(campo('Nome da categoria', campoNome));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Criar e marcar', function () {
        var nome = campoNome.value.trim().slice(0, 30);
        if (!nome) { mostrarErro(forma, 'Escreva o nome da categoria.'); return; }
        if (categoriasDe('saida').indexOf(nome) >= 0) { mostrarErro(forma, 'Essa categoria já existe.'); return; }

        estado.categoriasExtras.saida.push(nome);
        dados.categorias.push({ nome: nome, valor: 0 });
        salvar();
        voltarNavegacao();
        avisar('Categoria ' + nome + ' criada.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: reserva ----------

  function abrirFolhaReserva() {
    abrirFolha('Reserva de emergência', function (folha) {
      var forma = no('div');
      var p = estado.perfil;
      var meses = p.reservaMeses;

      forma.appendChild(no('p', 'linha-sub',
        'Quantos meses de despesa você quer ter guardados. Usamos a média das suas saídas dos últimos 3 meses.'));

      var chips = grupoChips(['3 meses', '6 meses', '12 meses'],
        meses + ' meses', function (v) { meses = parseInt(v, 10); atualizar(); });
      var wrap = campo(null, chips);
      wrap.style.marginTop = '14px';
      forma.appendChild(wrap);

      var opcoesConta = [{ valor: '', rotulo: 'Não tenho uma conta separada' }].concat(
        estado.contas.map(function (c) {
          return { valor: c.id, rotulo: c.nome, detalhe: emReais(saldoConta(c.id, null)) };
        }));
      var campoConta = entradaSelecao(opcoesConta, p.reservaConta || '', 'Conta da reserva');
      forma.appendChild(campo('Qual conta guarda a reserva (opcional)', campoConta));

      var campoManual = entradaValor(p.reservaManual, false);
      var caixaManual = campo('Ou informe o valor à mão', campoManual);
      forma.appendChild(caixaManual);

      var painel = cartao();
      forma.appendChild(painel);

      function atualizar() {
        var media = mediaDespesas(3);
        var ideal = media * meses;
        var contaId = campoConta.value;
        var manual = digitosParaCentavos(campoManual.value);
        var guardado = contaId ? Math.max(saldoConta(contaId, null), 0)
                     : manual > 0 ? manual
                     : Math.max(totalEmContas(null), 0);
        caixaManual.style.display = contaId ? 'none' : '';

        painel.textContent = '';
        painel.appendChild(no('div', 'rotulo', 'Reserva ideal'));
        painel.appendChild(no('div', 'valorao pequeno num ouro', emReais(ideal)));
        painel.appendChild(no('div', 'linha-nota',
          meses + ' meses × ' + emReais(media) + ' de despesa média por mês.'));

        var grade = no('div', 'resumo-grade');
        [['Você tem', guardado, 'verde'], ['Falta', Math.max(ideal - guardado, 0),
          ideal - guardado > 0 ? 'vermelho' : 'verde']].forEach(function (item) {
          var d = no('div');
          d.appendChild(no('div', 'r', item[0]));
          d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
          grade.appendChild(d);
        });
        painel.appendChild(grade);
        painel.appendChild(progresso(guardado, ideal || 1,
          guardado >= ideal ? 'var(--verde)' : 'var(--ouro)'));
      }
      campoConta.aoMudar = atualizar;
      campoManual.addEventListener('input', atualizar);
      atualizar();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        estado.perfil.reservaMeses = meses;
        estado.perfil.reservaConta = campoConta.value;
        estado.perfil.reservaManual = digitosParaCentavos(campoManual.value);
        salvar();
        fecharFolha();
        desenhar();
        avisar('Reserva ajustada para ' + meses + ' meses.');
      }));
      acoes.appendChild(botao('btn btn-fantasma', 'Não preciso de reserva', function () {
        perguntar({
          titulo: 'Tirar a reserva do Planejar?',
          texto: 'O cartão some da tela. Para trazer de volta, é em Mais → Preferências.',
          ok: 'Tirar do Planejar'
        }, function () {
          estado.perfil.reservaLigada = false;
          salvar();
          fecharFolha();
          desenhar();
          avisar('Reserva desligada. Volte por Mais → Preferências.');
        });
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: aposentadoria ----------

  function abrirFolhaAposentadoria() {
    abrirFolha('Aposentadoria', function (folha) {
      var forma = no('div');
      var p = estado.perfil;

      var campoIdade = entradaTextoNumero(p.idadeAtual, '30');
      forma.appendChild(campo('Sua idade hoje', campoIdade));

      var campoAlvo = entradaTextoNumero(p.idadeAposentadoria, '60');
      forma.appendChild(campo('Idade em que quer parar', campoAlvo));

      var opcoesConta = [{ valor: '', rotulo: 'Nenhuma — começar do zero' }].concat(
        estado.contas.map(function (c) {
          return { valor: c.id, rotulo: c.nome, detalhe: emReais(saldoConta(c.id, null)) };
        }));
      var campoConta = entradaSelecao(opcoesConta, p.contaAposentadoria || '', 'Conta da aposentadoria');
      forma.appendChild(campo('Qual conta guarda esse dinheiro (opcional)', campoConta));

      var campoAporte = entradaValor(p.aporteMensal, false);
      forma.appendChild(campo('Quanto pretende aportar por mês', campoAporte));

      var campoTaxa = entradaTextoNumero(p.rendimentoAnual, '8');
      forma.appendChild(campo('Rendimento esperado ao ano (%)', campoTaxa));

      var campoInflacao = entradaTextoNumero(p.inflacaoAnual, '4');
      forma.appendChild(campo('Inflação anual estimada (%)', campoInflacao));

      var campoRetirada = entradaTextoNumero(p.retiradaAnual, '4');
      forma.appendChild(campo('Quanto pretende retirar por ano (%)', campoRetirada));

      var campoMeta = entradaValor(p.metaPatrimonio, false);
      forma.appendChild(campo('Meta de patrimônio (opcional)', campoMeta));

      var painel = cartao();
      forma.appendChild(painel);

      // A conta roda com o que está escrito agora, sem precisar salvar antes.
      function simular() {
        var guardado = estadoAtualDoPerfil();
        var antes = {};
        Object.keys(guardado).forEach(function (k) { antes[k] = p[k]; p[k] = guardado[k]; });
        var a = calculoAposentadoria();
        Object.keys(antes).forEach(function (k) { p[k] = antes[k]; });
        return a;
      }

      function estadoAtualDoPerfil() {
        var idade = Math.min(Math.max(Math.round(comoNumero(campoIdade.value, 30)), 14), 100);
        var alvo = Math.min(Math.max(Math.round(comoNumero(campoAlvo.value, 60)), 15), 110);
        return {
          idadeAtual: idade,
          idadeAposentadoria: alvo,
          contaAposentadoria: campoConta.value,
          aporteMensal: digitosParaCentavos(campoAporte.value),
          rendimentoAnual: Math.min(Math.max(comoNumero(campoTaxa.value, 8), 0), 60),
          inflacaoAnual: Math.min(Math.max(comoNumero(campoInflacao.value, 4), 0), 40),
          retiradaAnual: Math.min(Math.max(comoNumero(campoRetirada.value, 4), 0.1), 20),
          metaPatrimonio: digitosParaCentavos(campoMeta.value)
        };
      }

      function pintar() {
        var a = simular();
        painel.textContent = '';
        painel.appendChild(no('div', 'rotulo',
          'Projeção aos ' + Math.round(comoNumero(campoAlvo.value, 60)) + ' anos'));
        painel.appendChild(no('div', 'valorao pequeno num ouro', emReais(a.bruto)));

        [
          ['Capital de partida', emReais(a.capital)],
          ['Total investido', emReais(a.investido)],
          ['Total em juros', emReais(a.juros)],
          ['Juros no montante', numeroBr(a.jurosPct) + '%'],
          ['Multiplicador', numeroBr(Math.round(a.multiplicador * 10) / 10) + 'x'],
          ['Taxa mensal', numeroBr(a.taxaMes) + '%'],
          ['Taxa real (sem inflação)', numeroBr(a.taxaRealAno) + '% ao ano'],
          ['Vale hoje', emReais(a.real)],
          ['Renda passiva', emReais(a.rendaPassiva) + ' por mês']
        ].forEach(function (par) {
          var l = no('div', 'parcela-linha');
          juntar(l, no('span', 'q', par[0]), no('span', 'v num', par[1]));
          painel.appendChild(l);
        });

        if (a.meta > 0) {
          var caixaMeta = no('div');
          caixaMeta.style.marginTop = '12px';
          var topoM = no('div', 'legenda-item');
          topoM.style.marginBottom = '5px';
          juntar(topoM, no('span', 'nome', 'Meta de patrimônio'),
            no('span', 'pct num', Math.round(a.metaPct) + '%'));
          caixaMeta.appendChild(topoM);
          caixaMeta.appendChild(progresso(a.bruto, a.meta,
            a.metaPct >= 100 ? 'var(--verde)' : 'var(--ouro)'));
          painel.appendChild(caixaMeta);
        }

        painel.appendChild(no('div', 'linha-nota',
          'Juros compostos mês a mês sobre ' + a.anos + ' anos. É uma estimativa, não uma promessa.'));
      }

      [campoIdade, campoAlvo, campoAporte, campoTaxa, campoInflacao, campoRetirada, campoMeta]
        .forEach(function (c) { c.addEventListener('input', pintar); });
      campoConta.aoMudar = pintar;
      pintar();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var novo = estadoAtualDoPerfil();
        if (novo.idadeAposentadoria <= novo.idadeAtual) {
          mostrarErro(forma, 'A idade de parar precisa ser maior que a idade de hoje.');
          return;
        }
        Object.keys(novo).forEach(function (k) { estado.perfil[k] = novo[k]; });
        salvar();
        fecharFolha();
        desenhar();
        avisar('Projeção atualizada.');
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Relatórios ----------

  function par(rotulo, valor, classe) {
    var d = no('div', 'rel-par');
    juntar(d, no('span', null, rotulo), no('span', 'v ' + (classe || ''), valor));
    return d;
  }

  function tabela(colunas, linhas) {
    var t = no('table', 'rel-tabela');
    var thead = no('thead');
    var tr = no('tr');
    colunas.forEach(function (c) {
      var th = no('th', c.numerica ? 'n' : null, c.rotulo);
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    t.appendChild(thead);

    var tbody = no('tbody');
    linhas.forEach(function (linha) {
      var l = no('tr');
      linha.forEach(function (celula, i) {
        var td = no('td', (colunas[i].numerica ? 'n ' : '') + (celula.classe || ''), celula.texto);
        l.appendChild(td);
      });
      tbody.appendChild(l);
    });
    t.appendChild(tbody);
    return t;
  }

  function celula(texto, classe) { return { texto: texto, classe: classe || '' }; }

  function abrirRelatorio(tipo) {
    var alvo = $('relConteudo');
    alvo.textContent = '';

    var periodo = MESES[mesAtivo.mes] + ' de ' + mesAtivo.ano;
    var t = totaisDoMes(mesAtivo.ano, mesAtivo.mes);
    var gastos = gastosPorCategoria(mesAtivo.ano, mesAtivo.mes);

    var titulos = {
      resumo: 'Resumo executivo',
      fluxo: 'Fluxo de caixa',
      investimentos: 'Investimentos',
      clientes: 'Clientes e cobranças',
      ir: 'Apoio ao imposto de renda'
    };

    alvo.appendChild(no('h1', null, titulos[tipo]));
    alvo.appendChild(no('div', 'rel-sub',
      (tipo === 'ir' ? 'Ano de ' + mesAtivo.ano : periodo) +
      ' · gerado em ' + dataBr(hojeTexto()) + (estado.perfil.nome ? ' · ' + estado.perfil.nome : '')));

    if (tipo === 'resumo') {
      alvo.appendChild(no('h2', null, 'Patrimônio'));
      alvo.appendChild(par('Total em contas', emReais(totalEmContas(null))));
      alvo.appendChild(par('Total investido', emReais(totalInvestido(null))));
      alvo.appendChild(par('Patrimônio líquido', emReais(patrimonio(null))));

      alvo.appendChild(no('h2', null, 'Fluxo do mês'));
      alvo.appendChild(par('Entradas', emReais(t.entradas), 'verde'));
      alvo.appendChild(par('Saídas', emReais(t.saidas), 'vermelho'));
      alvo.appendChild(par('Resultado', emReais(t.saldo), t.saldo >= 0 ? 'verde' : 'vermelho'));
      if (t.entradas > 0) {
        alvo.appendChild(par('Taxa de poupança', ((t.saldo / t.entradas) * 100).toFixed(1).replace('.', ',') + '%'));
      }

      if (estado.contas.length) {
        alvo.appendChild(no('h2', null, 'Contas'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Conta' }, { rotulo: 'Tipo' }, { rotulo: 'Saldo', numerica: true }],
          estado.contas.map(function (c) {
            return [celula(c.nome), celula(c.tipo), celula(emReais(saldoConta(c.id, null)))];
          })
        ));
      }

      if (gastos.lista.length) {
        alvo.appendChild(no('h2', null, 'Gastos por categoria'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Categoria' }, { rotulo: 'Valor', numerica: true }, { rotulo: '%', numerica: true }],
          gastos.lista.map(function (g) {
            return [celula(g.nome), celula(emReais(g.valor)), celula(Math.round(pct(g.valor, gastos.total)) + '%')];
          })
        ));
      }

      if (estado.metas.length) {
        alvo.appendChild(no('h2', null, 'Metas'));
        alvo.appendChild(tabela(
          [{ rotulo: 'Meta' }, { rotulo: 'Guardado', numerica: true }, { rotulo: 'Alvo', numerica: true }, { rotulo: '%', numerica: true }],
          estado.metas.map(function (m) {
            return [celula(m.nome), celula(emReais(m.guardado)), celula(emReais(m.alvo)),
                    celula(Math.round(pct(m.guardado, m.alvo)) + '%')];
          })
        ));
      }
    }

    if (tipo === 'fluxo') {
      alvo.appendChild(no('h2', null, 'Resumo'));
      alvo.appendChild(par('Entradas', emReais(t.entradas), 'verde'));
