      setTimeout(function () { abrirFolhaLancamento(l.id); }, 240);
    });
    juntar(linha,
      seloDeConta(cart),
      juntar(no('div', 'linha-texto'),
        no('div', 'linha-titulo', l.descricao || l.categoria),
        no('div', 'linha-sub', dataBr(l.data) + ' · ' + l.categoria)),
      juntar(no('div', 'linha-fim'),
        no('div', 'linha-valor num' + (l.tipo === 'entrada' ? ' verde' : ' vermelho'),
          (l.tipo === 'entrada' ? '+ ' : '− ') + emReais(l.valor)))
    );
    return linha;
  }

  function abrirFaturaDoMes(id, chave) {
    var cart = achar(estado.contas, id);
    var f = null;
    faturasDoCartao(id).forEach(function (x) { if (x.chave === chave) f = x; });
    if (!cart || !f) return;

    abrirFolha('Fatura de ' + f.rotulo, function (folha) {
      var topo = cartao();
      topo.appendChild(no('div', 'rotulo', 'Total da fatura'));
      topo.appendChild(no('div', 'valorao num' + (f.total > 0 ? ' vermelho' : ''), emReais(f.total)));
      var nota = ['de ' + dataBr(f.de) + ' a ' + dataBr(f.ate)];
      if (f.vence) nota.push('vence em ' + dataBr(f.vence));
      if (f.pago) nota.push(emReais(f.pago) + ' pago');
      topo.appendChild(no('div', 'linha-nota', nota.join(' · ')));
      folha.appendChild(topo);

      var c = cartao('liso');
      f.itens.slice().sort(function (a, b) { return a.data < b.data ? 1 : -1; })
        .forEach(function (l) { c.appendChild(linhaDeGasto(l, cart)); });
      folha.appendChild(c);
    });
  }

  // ---------- Empreendedor: tela ----------

  function desenharEmpreendedor(tela) {
    var geral = resumoGeralClientes();

    var cResumo = cartao();
    cResumo.appendChild(no('div', 'rotulo', 'A receber de todos os clientes'));
    cResumo.appendChild(no('div', 'valorao num ' + (geral.restante > 0 ? 'ouro' : 'verde'), emReais(geral.restante)));

    var barra = no('div', 'barra-dupla');
    barra.style.marginTop = '10px';
    var iPago = no('i');
    iPago.style.width = pct(geral.pago, geral.total) + '%';
    iPago.style.background = 'var(--verde)';
    var iFalta = no('i');
    iFalta.style.width = (geral.total > 0 ? 100 - pct(geral.pago, geral.total) : 0) + '%';
    iFalta.style.background = 'var(--ouro)';
    juntar(barra, iPago, iFalta);
    cResumo.appendChild(barra);

    var grade = no('div', 'resumo-grade');
    [['Total', geral.total, ''], ['Recebido', geral.pago, 'verde'], ['Falta', geral.restante, 'ouro']].forEach(function (item) {
      var d = no('div');
      d.appendChild(no('div', 'r', item[0]));
      d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
      grade.appendChild(d);
    });
    cResumo.appendChild(grade);

    var proxima = proximoPagamentoGeral();
    if (proxima) {
      cResumo.appendChild(no('div', 'linha-nota', 'Próximo pagamento previsto para ' + dataBr(proxima) + '.'));
    }
    if (geral.atrasados) {
      var alerta = no('div', 'linha-nota vermelho',
        geral.atrasados + ' cliente(s) em atraso, somando ' + emReais(geral.emAtraso) + '.');
      cResumo.appendChild(alerta);
    }
    tela.appendChild(cResumo);

    var cClientes = cartao('liso');
    var topo = topoDeCartao('Clientes', '+ Novo', function () { abrirFolhaCliente(null); });
    topo.style.padding = '16px 16px 0';
    topo.style.marginBottom = '8px';
    cClientes.appendChild(topo);

    if (!estado.clientes.length) {
      cClientes.appendChild(estadoVazio('Nenhum cliente ainda',
        'Cadastre quem contratou seu serviço para acompanhar o que já foi pago e o que falta receber.'));
      var b = botao('btn btn-ouro', 'Cadastrar primeiro cliente', function () { abrirFolhaCliente(null); });
      b.style.margin = '0 16px 18px';
      b.style.width = 'calc(100% - 32px)';
      cClientes.appendChild(b);
    } else {
      // Quem está atrasado sobe para o topo.
      estado.clientes.slice().sort(function (a, b) {
        var atA = clienteAtrasado(a.id) ? 1 : 0;
        var atB = clienteAtrasado(b.id) ? 1 : 0;
        if (atA !== atB) return atB - atA;
        return resumoCliente(b.id).restante - resumoCliente(a.id).restante;
      }).forEach(function (c) {
        var r = resumoCliente(c.id);
        var sit = situacaoCliente(c);
        var atrasado = sit.classe === 'atrasado';

        var linha = no('div', 'linha linha-dupla' + (atrasado ? ' atrasada' : ''));
        var alvo = botao('linha-alvo', null, function () {
          if (atrasado) { abrirResumoAtraso(c.id); return; }
          abrirFichaCliente(c.id);
        });

        var texto = no('div', 'linha-texto');
        texto.appendChild(no('div', 'linha-titulo', c.nome));
        var sub = no('div', 'linha-sub');
        var fones = telefonesDoCliente(c);
        sub.appendChild(document.createTextNode(
          servicosDoCliente(c.id).length + ' registro(s)' +
          (fones.length ? ' · ' + telefoneBonito(fones[0].numero) : '') +
          (fones.length > 1 ? ' +' + (fones.length - 1) : '')));
        texto.appendChild(sub);

        var fim = no('div', 'linha-fim');
        fim.appendChild(no('div', 'linha-valor num ' +
          (atrasado ? 'vermelho' : r.restante > 0 ? 'ouro' : 'verde'), emReais(r.restante)));
        fim.appendChild(no('span', 'etiqueta ' + sit.classe, sit.texto));

        juntar(alvo, selo(atrasado ? '#FF6B6B' : sit.classe === 'quitado' ? '#3DDC84' : '#E9B44C',
          c.nome.charAt(0).toUpperCase()), texto, fim);
        linha.appendChild(alvo);

        if (r.restante > 0 && temWhatsapp(c)) {
          var zap = botao('linha-acao', null, function () {
            abrirWhatsapp(c, mensagemDeCobranca(c));
          });
          zap.setAttribute('aria-label', 'Falar com ' + c.nome + ' no WhatsApp');
          zap.style.color = '#25D366';
          zap.appendChild(iconeWhatsapp());
          linha.appendChild(zap);
        }

        cClientes.appendChild(linha);
      });
    }
    tela.appendChild(cClientes);

  }

  // O que venceu e ainda não foi pago, com o atalho para o WhatsApp.
  function abrirResumoAtraso(clienteId) {
    var cliente = achar(estado.clientes, clienteId);
    if (!cliente) return;
    var atraso = atrasoDoCliente(clienteId);
    var r = resumoCliente(clienteId);

    abrirFolha('Cobrança de ' + cliente.nome, function (folha) {
      var cabeca = cartao();
      cabeca.appendChild(no('div', 'rotulo', 'Em atraso'));
      cabeca.appendChild(no('div', 'valorao vermelho num',
        emReais(atraso.total || r.restante)));
      if (atraso.desde) {
        cabeca.appendChild(no('div', 'linha-nota', 'A parcela mais antiga venceu em ' + dataBr(atraso.desde) + '.'));
      }
      cabeca.appendChild(no('div', 'linha-nota',
        'No total, ainda faltam ' + emReais(r.restante) + ' deste cliente.'));
      folha.appendChild(cabeca);

      if (atraso.vencidas.length) {
        var lista = cartao();
        lista.appendChild(no('div', 'cartao-titulo', 'O que deveria ter sido pago'));
        var caixa = no('div');
        caixa.style.marginTop = '10px';
        atraso.vencidas.forEach(function (p) {
          var servicoP = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
          var l = no('div', 'parcela-linha vencida');
          juntar(l,
            no('span', 'q', 'Parcela ' + p.numero + '/' + p.total + ' · venceu em ' + dataBr(p.vencimento) +
              (servicoP ? ' · ' + servicoP.nome : '')),
            no('span', 'v num', emReais(p.valor)));
          caixa.appendChild(l);
        });
        lista.appendChild(caixa);
        folha.appendChild(lista);
      } else {
        var semParcela = cartao();
        semParcela.appendChild(no('p', 'linha-sub',
          'Não há parcelas combinadas para este cliente. A data prevista no cadastro já passou.'));
        folha.appendChild(semParcela);
      }

      var acoes = no('div', 'acoes');
      if (temWhatsapp(cliente)) {
        var whats = botao('btn-whats', null, function () {
          abrirWhatsapp(cliente, mensagemDeCobranca(cliente));
        });
        whats.appendChild(iconeWhatsapp());
        whats.appendChild(no('span', null, 'Mandar mensagem no WhatsApp'));
        acoes.appendChild(whats);
        acoes.appendChild(no('div', 'linha-nota',
          'A conversa abre com o texto já escrito. Você lê, muda o que quiser e só então envia.'));
      } else if (cliente.telefone) {
        acoes.appendChild(no('div', 'linha-nota',
          'Este cliente está marcado como sem WhatsApp. Você pode mudar isso em Editar cliente.'));
      } else {
        acoes.appendChild(no('div', 'linha-nota',
          'Cadastre o celular do cliente para poder cobrar pelo WhatsApp.'));
      }
      acoes.appendChild(botao('btn btn-ouro', 'Registrar pagamento', function () {
        fecharFolha();
        setTimeout(function () { abrirFolhaPagamento(clienteId, null); }, 250);
      }));
      acoes.appendChild(botao('btn btn-fantasma', 'Abrir a ficha do cliente', function () {
        fecharFolha();
        setTimeout(function () { abrirFichaCliente(clienteId); }, 250);
      }));
      folha.appendChild(acoes);
    });
  }

  // ---------- Empreendedor: folhas ----------

  function abrirFolhaCliente(id) {
    var existente = id ? achar(estado.clientes, id) : null;
    if (id && !existente) return;

    abrirFolha(existente ? 'Editar cliente' : 'Novo cliente', function (folha) {
      var forma = no('div');

      var campoNome = entradaTexto(existente ? existente.nome : '', 'Nome do cliente', 60);
      forma.appendChild(campo('Nome', campoNome));

      // Uma linha por número. Cada uma tem o seu botão de WhatsApp.
      var numeros = existente ? telefonesDoCliente(existente).map(function (t) {
        return { numero: t.numero, whats: t.whats !== false };
      }) : [];
      if (!numeros.length) numeros = [{ numero: '', whats: true }];

      var caixaNumeros = no('div');
      forma.appendChild(campo('Celulares', caixaNumeros));

      var resumoNumeros = no('div', 'telefone-marca');
      forma.appendChild(resumoNumeros);

      function pintarNumeros() {
        caixaNumeros.textContent = '';
        numeros.forEach(function (item, i) {
          var linha = no('div', 'telefone-linha');

          var entrada = entradaTelefone(item.numero);
          var alterna = botao('linha-acao', null, function () {
            verificarNumero(item, pintarAlterna);
          });
          alterna.appendChild(iconeWhatsapp());

          // Só a cor do ícone muda; refazer a lista a cada tecla tiraria o
          // teclado do ar no meio da digitação.
          function pintarAlterna() {
            alterna.className = 'linha-acao' + (item.whats ? ' tem-whats' : '');
            alterna.setAttribute('aria-label', 'Verificar o WhatsApp deste número');
            alterna.title = item.whats ? 'Marcado como WhatsApp' : 'Marcado como sem WhatsApp';
          }
          pintarAlterna();

          entrada.addEventListener('input', function () {
            item.numero = soDigitos(entrada.value);
            // Fixo não costuma ter WhatsApp; celular sim. Depois que você
            // decide no ícone verde, a sua escolha manda.
            if (!item.tocado) { item.whats = pareceCelular(item.numero); pintarAlterna(); }
            contarNumeros();
          });

          linha.appendChild(entrada);
          linha.appendChild(alterna);

          if (numeros.length > 1) {
            var tirar = botao('linha-acao', null, function () {
              numeros.splice(i, 1);
              pintarNumeros();
            });
            tirar.setAttribute('aria-label', 'Remover este número');
            tirar.appendChild(icone('lixo'));
            linha.appendChild(tirar);
          }

          caixaNumeros.appendChild(linha);
        });

        if (numeros.length < 6) {
          var somar = botao('btn btn-fantasma', '+ Outro número', function () {
            numeros.push({ numero: '', whats: true });
            pintarNumeros();
          });
          somar.style.padding = '11px';
          somar.style.fontSize = '14px';
          caixaNumeros.appendChild(somar);
        }

        contarNumeros();
      }

      function contarNumeros() {
        var validos = numeros.filter(function (t) { return numeroWhatsapp(t.numero); });
        var comWhats = validos.filter(function (t) { return t.whats; });
        resumoNumeros.textContent = '';
        if (!validos.length) {
          resumoNumeros.appendChild(document.createTextNode(
            'Toque no ícone do WhatsApp para verificar cada número.'));
          return;
        }
        resumoNumeros.appendChild(no('span', 'n', comWhats.length + ' de ' + validos.length));
        resumoNumeros.appendChild(document.createTextNode(
          ' número(s) com WhatsApp. Toque no ícone para verificar ou testar.'));
      }

      // Nenhum site consegue perguntar ao WhatsApp quem tem conta: isso não
      // é aberto. O app olha o formato do número (celular sim, fixo não),
      // já deixa marcado o que achou, e a confirmação de verdade é abrir a
      // conversa. Se ele errar, você marca na mão aqui mesmo.
      function verificarNumero(item, aoPintar) {
        if (!numeroWhatsapp(item.numero)) {
          avisarCaixa('Número incompleto',
            'Escreva o número com DDD para o app poder verificar.');
          return;
        }

        if (!item.tocado) {
          item.whats = pareceCelular(item.numero);
          aoPintar();
          contarNumeros();
        }

        abrirEscolha({
          titulo: telefoneBonito(item.numero),
          valor: item.whats ? 'sim' : 'nao',
          opcoes: [
            {
              valor: 'sim', rotulo: 'Tem WhatsApp',
              detalhe: pareceCelular(item.numero)
                ? 'é celular — foi o que o app achou' : 'entra nas cobranças por aqui'
            },
            {
              valor: 'nao', rotulo: 'Não tem WhatsApp',
              detalhe: pareceCelular(item.numero)
                ? 'o ícone verde some' : 'é fixo — foi o que o app achou'
            }
          ],
          acao: {
            rotulo: 'Abrir a conversa para testar',
            aoTocar: function () {
              window.open('https://wa.me/' + numeroWhatsapp(item.numero), '_blank', 'noopener');
            }
          }
        }, function (escolhido) {
          if (escolhido == null) return;
          item.whats = escolhido === 'sim';
          item.tocado = true;
          aoPintar();
          contarNumeros();
        });
      }

      pintarNumeros();

      var campoObs = entradaTexto(existente ? existente.obs : '', 'Anotação (opcional)', 200);
      forma.appendChild(campo('Observação', campoObs));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = campoNome.value.trim();
        if (!nome) { mostrarErro(forma, 'Escreva o nome do cliente.'); return; }

        var lista = numeros.filter(function (t) { return soDigitos(t.numero); })
          .map(function (t) { return { numero: soDigitos(t.numero), whats: !!t.whats, rotulo: '' }; });
        var principal = lista.length ? lista[0] : { numero: '', whats: true };

        if (existente) {
          existente.nome = nome;
          existente.telefones = lista;
          existente.telefone = principal.numero;
          existente.whatsapp = principal.whats;
          existente.obs = campoObs.value.trim();
        } else {
          estado.clientes.push({
            id: novoId(), nome: nome,
            telefones: lista,
            telefone: principal.numero,
            whatsapp: principal.whats,
            obs: campoObs.value.trim(),
            proximoPagamento: '',
            criadoEm: Date.now()
          });
        }
        salvar();
        fecharFolha();
        desenhar();
        avisar(existente ? 'Cliente atualizado.' : 'Cliente cadastrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir cliente', function () {
          var quantos = servicosDoCliente(existente.id).length + pagamentosDoCliente(existente.id).length +
            estado.parcelas.filter(function (p) { return p.clienteId === existente.id; }).length;
          perguntar({
            titulo: 'Excluir ' + existente.nome + '?',
            texto: 'Vão embora também os ' + quantos + ' registro(s) desse cliente. Não dá para desfazer.',
            ok: 'Excluir cliente', tom: 'perigo'
          }, function () {
          estado.servicos.forEach(function (s) { if (s.clienteId === existente.id) marcarExcluido('servicos', s.id); });
          estado.pagamentos.forEach(function (p) { if (p.clienteId === existente.id) marcarExcluido('pagamentos', p.id); });
          estado.parcelas.forEach(function (p) { if (p.clienteId === existente.id) marcarExcluido('parcelas', p.id); });
          marcarExcluido('clientes', existente.id);
          estado.servicos = estado.servicos.filter(function (s) { return s.clienteId !== existente.id; });
          estado.pagamentos = estado.pagamentos.filter(function (p) { return p.clienteId !== existente.id; });
          estado.parcelas = estado.parcelas.filter(function (p) { return p.clienteId !== existente.id; });
          estado.clientes = estado.clientes.filter(function (c) { return c.id !== existente.id; });
          salvar();
          fecharFolha();
          desenhar();
          avisar('Cliente excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  var abaFicha = 'servicos';

  function abrirFichaCliente(id) {
    var cliente = achar(estado.clientes, id);
    if (!cliente) return;
    abaFicha = 'servicos';
    montarFichaCliente(id);
  }

  function montarFichaCliente(id) {
    var cliente = achar(estado.clientes, id);
    if (!cliente) { fecharFolha(); return; }
    var r = resumoCliente(id);
    var atraso = atrasoDoCliente(id);

    abrirFolha(cliente.nome, function (folha) {
      var tituloEl = $('folhaTitulo');
      tituloEl.classList.add('com-acao');
      var lapisCliente = botao('titulo-acao', null, function () {
        empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(id); } });
        abrirFolhaCliente(id);
      });
      lapisCliente.setAttribute('aria-label', 'Editar ' + cliente.nome);
      lapisCliente.appendChild(icone('lapis'));
      tituloEl.appendChild(lapisCliente);

      var fones = telefonesDoCliente(cliente);
      if (fones.length) {
        var tel = no('p', 'linha-sub', fones.map(function (t) {
          return telefoneBonito(t.numero) + (t.whats ? '' : ' (sem WhatsApp)');
        }).join('  ·  '));
        tel.style.textAlign = 'center';
        tel.style.marginTop = '-10px';
        folha.appendChild(tel);
      }

      if (atraso.vencidas.length) {
        var faixa = no('div', 'aviso-atraso');
        faixa.style.marginTop = '14px';
        faixa.appendChild(icone('alerta'));
        var txtAtraso = no('div');
        txtAtraso.appendChild(no('div', null, atraso.vencidas.length + ' pagamento(s) em atraso'));
        txtAtraso.appendChild(no('div', 'n', emReais(atraso.total) + ' desde ' + dataBr(atraso.desde)));
        faixa.appendChild(txtAtraso);
        folha.appendChild(faixa);
      }

      var cResumo = cartao();
      var grade = no('div', 'resumo-grade');
      grade.style.marginTop = '0';
      [['Total', r.total, ''], ['Pago', r.pago, 'verde'], ['Falta', r.restante, r.restante > 0 ? 'ouro' : 'verde']].forEach(function (item) {
        var d = no('div');
        d.appendChild(no('div', 'r', item[0]));
        d.appendChild(no('div', 'v ' + item[2], emReais(item[1])));
        grade.appendChild(d);
      });
      cResumo.appendChild(grade);
      cResumo.appendChild(progresso(r.pago, r.total || 1, 'var(--verde)'));
      var proximaData = proximoVencimento(id);
      if (proximaData && r.restante > 0) {
        cResumo.appendChild(no('div', 'linha-nota',
          'Próximo pagamento previsto para ' + dataBr(proximaData) + '.'));
      }
      if (cliente.obs) cResumo.appendChild(no('div', 'linha-nota', cliente.obs));
      folha.appendChild(cResumo);

      var abas = no('div', 'aba-cliente');
      [['servicos', 'Registros'], ['parcelas', 'Parcelas'], ['pagamentos', 'Pagos']].forEach(function (a) {
        var b = botao(null, a[1], function () {
          if (abaFicha === a[0]) return;
          abaFicha = a[0];
          montarFichaCliente(id);
        });
        b.setAttribute('aria-selected', abaFicha === a[0] ? 'true' : 'false');
        abas.appendChild(b);
      });
      folha.appendChild(abas);

      var lista = cartao('liso');
      if (abaFicha === 'servicos') {
        var servicos = servicosDoCliente(id);
        if (!servicos.length) {
          lista.appendChild(estadoVazio('Nenhum registro',
            'Cadastre a venda ou o serviço e o valor combinado.'));
        } else {
          servicos.forEach(function (s) {
            var linha = botao('linha', null, function () { abrirFolhaServico(id, s.id); });
            juntar(linha,
              selo(corDeCategoria(s.tipo || 'Serviço'), (s.tipo || 'S').charAt(0).toUpperCase()),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', s.nome),
                no('div', 'linha-sub', (s.tipo || 'Serviço') + ' · ' + dataBr(s.data) + (s.obs ? ' · ' + s.obs : ''))),
              juntar(no('div', 'linha-fim'), no('div', 'linha-valor num', emReais(s.valor)))
            );
            lista.appendChild(linha);
          });
        }
      } else if (abaFicha === 'parcelas') {
        var parcelas = parcelasDoCliente(id);
        if (!parcelas.length) {
          lista.appendChild(estadoVazio('Sem parcelas combinadas',
            'Monte a previsão de pagamento para acompanhar o que vence e quando.'));
        } else {
          var hojeP = hojeTexto();
          parcelas.forEach(function (p) {
            var paga = parcelaPaga(p);
            var vencida = !paga && p.vencimento < hojeP;
            var servicoP = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
            var parcial = parcelaParcial(p);
            var jurosP = jurosDaParcela(p);
            var recebido = pagoNaParcela(p);
            // Numa parcela paga, o número em verde é o que entrou de verdade.
            // Quando ela foi coberta pela sobra de outro pagamento, não há
            // dinheiro lançado nela, então mostramos o valor combinado.
            var comDinheiro = paga && recebido > 0;
            var mostrar = paga ? (comDinheiro ? recebido : p.valor) : p.valor + jurosP;

            var sub = (paga ? 'Paga' : vencida ? 'Venceu' : 'Vence') + ' em ' +
              dataBr(paga && p.quitadaEm ? p.quitadaEm : p.vencimento);
            if (parcial) sub = 'Faltam ' + emReais(faltaNaParcela(p)) + ' · ' + sub.toLowerCase();
            if (comDinheiro && recebido !== p.valor) sub += ' · combinada em ' + emReais(p.valor);
            if (paga && !comDinheiro) sub += ' · coberta por outro pagamento';
            if (jurosP > 0) sub += ' · ' + emReais(jurosP) + ' de juros';
            if (servicoP) sub += ' · ' + servicoP.nome;

            var linha = botao('linha' + (vencida ? ' atrasada' : ''), null, function () {
              if (!paga) { abrirFolhaParcela(id, p.id); return; }
              var recibo = p.pagamentoId || pagamentoDaParcela(p);
              if (recibo) { abrirFolhaPagamento(id, recibo); return; }
              avisarCaixa('Parcela ' + p.numero + ' de ' + p.total,
                'Ela foi quitada com o que sobrou de outro pagamento, então não tem um recebimento próprio para abrir.');
            });
            juntar(linha,
              selo(paga ? '#3DDC84' : vencida ? '#FF6B6B' : parcial ? '#38BDF8' : '#E9B44C',
                paga ? '✓' : String(p.numero)),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', 'Parcela ' + p.numero + ' de ' + p.total),
                no('div', 'linha-sub', sub)),
              juntar(no('div', 'linha-fim'),
                no('div', 'linha-valor num' + (paga ? ' verde' : vencida ? ' vermelho' : ''),
                  emReais(mostrar)))
            );
            lista.appendChild(linha);
          });
        }
      } else {
        var pagamentos = pagamentosDoCliente(id);
        if (!pagamentos.length) {
          lista.appendChild(estadoVazio('Nenhum pagamento', 'Registre cada valor recebido com a data.'));
        } else {
          pagamentos.forEach(function (p) {
            var servico = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
            var linha = botao('linha', null, function () { abrirFolhaPagamento(id, p.id); });
            juntar(linha,
              selo('#34D399', '✓'),
              juntar(no('div', 'linha-texto'),
                no('div', 'linha-titulo', dataBr(p.data)),
                no('div', 'linha-sub', servico ? servico.nome : 'Pagamento' + (p.lancamentoId ? ' · lançado no caixa' : ''))),
              juntar(no('div', 'linha-fim'), no('div', 'linha-valor num verde', '+ ' + emReais(p.valor)))
            );
            lista.appendChild(linha);
          });
        }
      }
      folha.appendChild(lista);

      var acoes = no('div', 'acoes');
      if (abaFicha === 'servicos') {
        acoes.appendChild(botao('btn btn-ouro', '+ Nova venda ou serviço', function () { abrirFolhaServico(id, null); }));
      } else if (abaFicha === 'parcelas') {
        acoes.appendChild(botao('btn btn-ouro', '+ Combinar parcelas', function () { abrirFolhaParcelamento(id, ''); }));

        // Se a soma das parcelas em aberto não bate com o que falta receber,
        // oferece o acerto em vez de deixar a conta torta em silêncio.
        var abertasAgora = parcelasDoCliente(id).filter(function (p) { return !parcelaPaga(p); });
        var somaAbertas = abertasAgora.reduce(function (s, p) { return s + p.valor; }, 0);
        var desencontro = Math.max(r.restante, 0) - somaAbertas;
        if (abertasAgora.length && desencontro !== 0) {
          var bAcertar = botao('btn btn-fantasma',
            'Acertar as parcelas (' + (desencontro > 0 ? 'faltam ' : 'sobram ') +
            emReais(Math.abs(desencontro)) + ')', function () {
            perguntar({
              titulo: 'Acertar o combinado?',
              texto: 'As parcelas em aberto somam ' + emReais(somaAbertas) + ', mas o cliente ainda deve ' +
                emReais(Math.max(r.restante, 0)) + '. O app ajusta a ponta do combinado para as duas contas baterem.',
              ok: 'Acertar', icone: 'alvo'
            }, function () {
              acertarParcelas(id, null);
              salvar();
              montarFichaCliente(id);
              avisar('Parcelas acertadas.');
            });
          });
          acoes.appendChild(bAcertar);
        }

        var todasParcelas = parcelasDoCliente(id);
        if (todasParcelas.length) {
          var pagasAgora = todasParcelas.filter(parcelaPaga).length;
          acoes.appendChild(botao('btn btn-perigo', 'Apagar as ' + todasParcelas.length + ' parcelas', function () {
            perguntar({
              titulo: 'Apagar o parcelamento inteiro?',
              texto: 'Saem todas as ' + todasParcelas.length + ' parcelas' +
                (pagasAgora ? (pagasAgora === 1 ? ', inclusive a que já foi paga'
                                                : ', inclusive as ' + pagasAgora + ' já pagas') : '') +
                '. Os registros e os pagamentos continuam como estão, e o que o cliente deve não muda — ' +
                'só o parcelamento é desfeito.',
              ok: 'Apagar tudo', tom: 'perigo'
            }, function () {
              var fora = {};
              todasParcelas.forEach(function (p) { fora[p.id] = true; marcarExcluido('parcelas', p.id); });
              estado.parcelas = estado.parcelas.filter(function (p) { return !fora[p.id]; });
              // Os pagamentos ficam, mas soltos: sem parcela para apontar.
              estado.pagamentos.forEach(function (g) { if (fora[g.parcelaId]) g.parcelaId = ''; });
              salvar();
              montarFichaCliente(id);
              avisar('Parcelamento apagado.');
            });
          }));
        }
      } else {
        acoes.appendChild(botao('btn btn-ouro', '+ Registrar pagamento', function () { abrirFolhaPagamento(id, null); }));
      }

      folha.appendChild(acoes);
    });
  }

  // A pessoa escolhe o tipo, cria os seus, renomeia e apaga.
  function opcoesDeTipo(incluir) {
    var lista = tiposDeRegistro();
    // Um registro antigo pode ter um tipo que já saiu da lista. Ele
    // continua aparecendo, para não trocar sozinho quando você salvar.
    if (incluir && lista.indexOf(incluir) < 0) lista = lista.concat([incluir]);
    return lista.map(function (t) { return { valor: t, rotulo: t }; });
  }

  function abrirGerenciarTipos(aoTerminar) {
    abrirEscolha({
      titulo: 'Tipos de registro',
      semMarca: true,
      opcoes: tiposDeRegistro().map(function (t) {
        var deFabrica = TIPOS_REGISTRO_BASE.indexOf(t) >= 0;
        return {
          valor: t,
          rotulo: t,
          detalhe: deFabrica ? 'de fábrica' : 'toque para renomear ou excluir',
          icone: deFabrica ? null : 'lapis'
        };
      }),
      valor: '',
      acao: { rotulo: '+ Criar tipo novo', aoTocar: function () { criarTipoRegistro(aoTerminar); } }
    }, function (escolhido) {
      if (escolhido == null) { if (aoTerminar) aoTerminar(); return; }
      if (TIPOS_REGISTRO_BASE.indexOf(escolhido) >= 0) {
        avisarCaixa('Tipo de fábrica', 'Venda e Serviço não podem ser mudados. Crie um tipo seu, se precisar.',
          function () { if (aoTerminar) aoTerminar(); });
        return;
      }
      editarTipoRegistro(escolhido, aoTerminar);
    });
  }

  function criarTipoRegistro(aoTerminar) {
    abrirFolhaTexto('Novo tipo', 'Nome do tipo', '', 'Ex.: Locação', function (nome) {
      if (tiposDeRegistro().indexOf(nome) >= 0) { avisar('Esse tipo já existe.'); return; }
      estado.tiposRegistro.push(nome);
      salvar();
      avisar('Tipo criado.');
      if (aoTerminar) aoTerminar(nome);
    }, aoTerminar);
  }

  function editarTipoRegistro(tipo, aoTerminar) {
    abrirFolhaTexto('Editar tipo', 'Nome do tipo', tipo, 'Nome do tipo', function (nome) {
      var i = estado.tiposRegistro.indexOf(tipo);
      if (i >= 0) estado.tiposRegistro[i] = nome;
      estado.servicos.forEach(function (s) { if (s.tipo === tipo) s.tipo = nome; });
      salvar();
      avisar('Tipo renomeado.');
      if (aoTerminar) aoTerminar(nome);
    }, aoTerminar, function (fecharDepois) {
      var usados = estado.servicos.filter(function (s) { return s.tipo === tipo; }).length;
      perguntar({
        titulo: 'Excluir o tipo ' + tipo + '?',
        texto: usados ? 'Os ' + usados + ' registro(s) com esse tipo passam a valer como "' + TIPO_PADRAO + '".'
                      : 'Nenhum registro usa esse tipo hoje.',
        ok: 'Excluir tipo', tom: 'perigo'
      }, function () {
        estado.tiposRegistro = estado.tiposRegistro.filter(function (t) { return t !== tipo; });
        estado.servicos.forEach(function (s) { if (s.tipo === tipo) s.tipo = TIPO_PADRAO; });
        salvar();
        avisar('Tipo excluído.');
        fecharDepois(TIPO_PADRAO);
      });
    });
  }

  // Uma folha pequena com um campo de texto só, para nomear coisas.
  function abrirFolhaTexto(titulo, rotulo, valor, dica, aoSalvar, aoVoltar, aoExcluir) {
    // Ao salvar já chamamos quem tem de ser chamado; sem esta marca o
    // "voltar" da pilha chamaria de novo e a tela piscaria duas vezes.
    var saindoPelaPorta = false;
    empilhar({ tipo: 'aba', voltar: function () { if (!saindoPelaPorta && aoVoltar) aoVoltar(); } });
    abrirFolha(titulo, function (folha) {
      var forma = no('div');
      var entrada = entradaTexto(valor, dica, 30);
      forma.appendChild(campo(rotulo, entrada));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var nome = entrada.value.trim();
        if (!nome) { mostrarErro(forma, 'Escreva um nome.'); return; }
        saindoPelaPorta = true;
        voltarNavegacao();
        setTimeout(function () { aoSalvar(nome); }, 240);
      }));
      if (aoExcluir) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir', function () {
          aoExcluir(function (subs) {
            saindoPelaPorta = true;
            voltarNavegacao();
            setTimeout(function () { if (aoVoltar) aoVoltar(subs); }, 240);
          });
        }));
      }
      forma.appendChild(acoes);
      folha.appendChild(forma);
      setTimeout(function () { entrada.focus(); }, 270);
    });
  }

  function abrirFolhaServico(clienteId, servicoId, rascunho) {
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });
    montarFolhaServico(clienteId, servicoId, rascunho);
  }

  // Separada do empilhar para poder ser remontada depois de mexer nos
  // tipos, sem perder o que já estava escrito nem empilhar de novo.
  function montarFolhaServico(clienteId, servicoId, rascunho) {
    var existente = servicoId ? achar(estado.servicos, servicoId) : null;
    var base = rascunho || {
      valor: existente ? existente.valor : 0,
      tipo: existente ? (existente.tipo || TIPO_PADRAO) : TIPO_PADRAO,
      nome: existente ? existente.nome : '',
      data: existente ? existente.data : hojeTexto(),
      obs: existente ? existente.obs : ''
    };
    var tipoEscolhido = base.tipo;

    abrirFolha(existente ? 'Editar registro' : 'Nova venda ou serviço', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(base.valor, true);
      campoValorEl.style.color = 'var(--ouro)';
      forma.appendChild(campo('Valor combinado', campoValorEl));

      var campoTipo = entradaSelecao(opcoesDeTipo(tipoEscolhido), tipoEscolhido, 'Tipo do registro');
      campoTipo.aoMudar = function (v) { tipoEscolhido = v; };
      var linhaTipo = no('div', 'linha-dupla-campo');
      var lapisTipo = botao('linha-acao', null, function () {
        var guardado = {
          valor: digitosParaCentavos(campoValorEl.value),
          tipo: campoTipo.value,
          nome: campoNome.value,
          data: campoData.value,
          obs: campoObs.value
        };
        abrirGerenciarTipos(function (novo) {
          guardado.tipo = novo || guardado.tipo;
          montarFolhaServico(clienteId, servicoId, guardado);
        });
      });
      lapisTipo.setAttribute('aria-label', 'Editar os tipos');
      lapisTipo.appendChild(icone('lapis'));
      juntar(linhaTipo, campoTipo, lapisTipo);
      forma.appendChild(campo('Tipo', linhaTipo));

      var campoNome = entradaTexto(base.nome, 'Ex.: Troca de embreagem', 60);
      forma.appendChild(campo('O que foi', campoNome));

      var campoData = entradaData(base.data || hojeTexto());
      forma.appendChild(campo('Realizado na data', campoData));

      var campoObs = entradaTexto(base.obs, 'Observação (opcional)', 200);
      forma.appendChild(campo('Observação', campoObs));

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        var nome = campoNome.value.trim();
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor combinado.'); return; }
        if (!nome) { mostrarErro(forma, 'Escreva o que foi vendido ou feito.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }

        var novoServicoId = existente ? existente.id : novoId();
        if (existente) {
          existente.nome = nome;
          existente.tipo = campoTipo.value;
          existente.valor = valor;
          existente.data = campoData.value;
          existente.obs = campoObs.value.trim();
        } else {
          estado.servicos.push({
            id: novoServicoId, clienteId: clienteId, nome: nome, tipo: campoTipo.value,
            valor: valor, data: campoData.value, obs: campoObs.value.trim(), criadoEm: Date.now()
          });
        }
        salvar();
        voltarNavegacao();
        if (existente) { avisar('Registro atualizado.'); return; }
        setTimeout(function () {
          perguntar({
            titulo: 'Combinar o pagamento?',
            texto: 'Você pode montar agora a previsão de parcelas de ' + emReais(valor) + '.',
            ok: 'Combinar parcelas', cancelar: 'Agora não', icone: 'alvo'
          }, function () { abrirFolhaParcelamento(clienteId, novoServicoId); });
        }, 320);
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir registro', function () {
          perguntar({
            titulo: 'Excluir este registro?',
            texto: 'Os pagamentos já recebidos continuam registrados; as parcelas em aberto saem junto.',
            ok: 'Excluir registro', tom: 'perigo'
          }, function () {
            marcarExcluido('servicos', existente.id);
            estado.servicos = estado.servicos.filter(function (s) { return s.id !== existente.id; });
            estado.pagamentos.forEach(function (p) { if (p.servicoId === existente.id) p.servicoId = ''; });
            estado.parcelas.forEach(function (p) {
              if (p.servicoId === existente.id && !parcelaPaga(p)) marcarExcluido('parcelas', p.id);
            });
            estado.parcelas = estado.parcelas.filter(function (p) {
              return p.servicoId !== existente.id || parcelaPaga(p);
            });
            salvar();
            voltarNavegacao();
            avisar('Registro excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // ---------- Folha: previsão de pagamento (parcelas) ----------
  //
  // Divide o valor, aplica o acréscimo escolhido e mostra o resumo do que
  // vai ser cobrado. Só grava quando você confirma.

  // totalAlvo > 0 manda: o total é o que você escreveu, e as parcelas saem
  // da divisão dele. Sem ele, o total vem do valor mais o acréscimo.
  // A sobra da divisão fica na última parcela, que é onde a pessoa espera.
  function espalhar(total, vezes, primeira) {
    var fatia = Math.floor(total / vezes);
    var itens = [];
    var acumulado = 0;
    for (var i = 0; i < vezes; i++) {
      var valor = i === vezes - 1 ? total - acumulado : fatia;
      acumulado += valor;
      itens.push({ numero: i + 1, total: vezes, valor: valor, vencimento: somaMeses(primeira, i) });
    }
    return itens;
  }

  // Escolhendo o valor da parcela, a quantidade sai da conta e o que ficar
  // quebrado vai para a última.
  function porValorDaParcela(total, porParcela, primeira) {
    var quantas = Math.max(1, Math.min(Math.ceil(total / porParcela), 240));
    var itens = [];
    var sobrando = total;
    for (var i = 0; i < quantas; i++) {
      var valor = i === quantas - 1 ? sobrando : Math.min(porParcela, sobrando);
      sobrando -= valor;
      itens.push({ numero: i + 1, total: quantas, valor: valor, vencimento: somaMeses(primeira, i) });
    }
    return itens;
  }

  function calcularParcelas(base, vezes, modo, acrescimo, primeira, totalAlvo, porParcela) {
    vezes = Math.max(1, Math.min(inteiro(vezes) || 1, 60));
    var itens = [];

    if (totalAlvo > 0) {
      if (porParcela > 0) {
        itens = porValorDaParcela(totalAlvo, porParcela, primeira);
        return { itens: itens, total: totalAlvo, acrescimoTotal: totalAlvo - base, manual: true, porParcela: true };
      }
      itens = espalhar(totalAlvo, vezes, primeira);
      return { itens: itens, total: totalAlvo, acrescimoTotal: totalAlvo - base, manual: true };
    }

    var fatia = Math.floor(base / vezes);
    var sobra = base - fatia * vezes;
    for (var i = 0; i < vezes; i++) {
      var semAcrescimo = fatia + (i === vezes - 1 ? sobra : 0);
      var valor = semAcrescimo;
      if (modo === 'porcento' && acrescimo > 0) valor = Math.round(semAcrescimo * (1 + acrescimo / 100));
      if (modo === 'reais' && acrescimo > 0) valor = semAcrescimo + acrescimo;
      itens.push({
        numero: i + 1,
        total: vezes,
        valor: valor,
        semAcrescimo: semAcrescimo,
        vencimento: somaMeses(primeira, i)
      });
    }
    var total = itens.reduce(function (soma, p) { return soma + p.valor; }, 0);

    // Com o valor da parcela escolhido, o acréscimo já está no total: só
    // refaço a divisão pelo valor pedido.
    if (porParcela > 0) {
      return { itens: porValorDaParcela(total, porParcela, primeira), total: total,
               acrescimoTotal: total - base, manual: false, porParcela: true };
    }
    return { itens: itens, total: total, acrescimoTotal: total - base, manual: false };
  }

  function abrirFolhaParcelamento(clienteId, servicoId) {
    var cliente = achar(estado.clientes, clienteId);
    if (!cliente) return;
    var servicos = servicosDoCliente(clienteId);
    var servicoInicial = servicoId ? achar(estado.servicos, servicoId) : null;
    var r = resumoCliente(clienteId);
    var jaParcelado = parcelasDoCliente(clienteId)
      .filter(function (p) { return !parcelaPaga(p); })
      .reduce(function (soma, p) { return soma + p.valor; }, 0);
    var sugestao = servicoInicial ? servicoInicial.valor : Math.max(r.restante - jaParcelado, 0);

    var vezes = 1;
    var modo = 'nenhum';

    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha('Previsão de pagamento', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(sugestao, true);
      campoValorEl.style.color = 'var(--ouro)';
      forma.appendChild(campo('Valor a combinar', campoValorEl));

      var opcoesServico = [{ valor: '', rotulo: 'Sem registro específico' }].concat(
        servicos.map(function (sv) { return { valor: sv.id, rotulo: sv.nome, detalhe: (sv.tipo || 'Serviço') + ' · ' + emReais(sv.valor) }; }));
      var campoServico = entradaSelecao(opcoesServico, servicoId || '', 'Referente a');
      forma.appendChild(campo('Referente a', campoServico));

      var campoData = entradaData(hojeTexto());
      forma.appendChild(campo('Primeira parcela vence em', campoData));

      var opcoesVezes = [];
      for (var v = 1; v <= 24; v++) {
        opcoesVezes.push({ valor: String(v), rotulo: v === 1 ? 'À vista (1x)' : v + 'x' });
      }
      var campoVezes = entradaSelecao(opcoesVezes, '1', 'Em quantas vezes');
      forma.appendChild(campo('Em quantas vezes', campoVezes));

      // Escolher o valor da parcela é o outro jeito de dizer a mesma coisa:
      // o app tira a quantidade da conta e deixa o quebrado na última.
      var parcelaManual = 0;
      var campoPorParcela = entradaValor(0, false);
      forma.appendChild(campo('Ou o valor de cada parcela', campoPorParcela));
      var notaParcela = no('div', 'linha-nota',
        'Escrevendo aqui, o app descobre em quantas vezes cabe e põe o que sobrar na última parcela. ' +
        'Deixe zerado para mandar pela quantidade de vezes.');
      notaParcela.style.margin = '-8px 0 16px';
      forma.appendChild(notaParcela);

      var campoModo = entradaSelecao([
        { valor: 'nenhum', rotulo: 'Sem acréscimo' },
        { valor: 'porcento', rotulo: 'Acrescentar % por parcela' },
        { valor: 'reais', rotulo: 'Acrescentar R$ por parcela' }
      ], 'nenhum', 'Acréscimo');
      forma.appendChild(campo('Acréscimo', campoModo));

      var campoPorcento = entradaTextoNumero('0', '0');
      var caixaPorcento = campo('Quanto por cento por parcela', campoPorcento);
      caixaPorcento.style.display = 'none';
      forma.appendChild(caixaPorcento);

      var campoReais = entradaValor(0, false);
      var caixaReais = campo('Quantos reais por parcela', campoReais);
      caixaReais.style.display = 'none';
      forma.appendChild(caixaReais);

      // Se você escrever o total, ele manda: as parcelas saem da divisão dele.
      var totalManual = 0;
      var campoTotal = entradaValor(sugestao, false);
      campoTotal.style.color = 'var(--ouro)';
      forma.appendChild(campo('Total a cobrar', campoTotal));
      var notaTotal = no('div', 'linha-nota',
        'Mexeu aqui, o app divide esse total pelas parcelas. Mexeu no valor ou no acréscimo, ele volta a calcular sozinho.');
      notaTotal.style.margin = '-8px 0 16px';
      forma.appendChild(notaTotal);

      var campoJuros = entradaTextoNumero('', '0');
      forma.appendChild(campo('Juros por atraso, ao mês (opcional %)', campoJuros));

      var resumo = cartao();
      forma.appendChild(resumo);

      function lerAcrescimo() {
        if (modo === 'porcento') {
          var p = Number(String(campoPorcento.value).replace(',', '.'));
          return isFinite(p) && p > 0 ? Math.min(p, 300) : 0;
        }
        if (modo === 'reais') return digitosParaCentavos(campoReais.value);
        return 0;
      }

      function contas() {
        return calcularParcelas(
          digitosParaCentavos(campoValorEl.value),
          vezes, modo, lerAcrescimo(),
          ehData(campoData.value) ? campoData.value : hojeTexto(),
          totalManual, parcelaManual
        );
      }

      function pintarResumo() {
        resumo.textContent = '';
        var base = digitosParaCentavos(campoValorEl.value);
        if (base <= 0) {
          resumo.appendChild(no('div', 'linha-sub', 'Informe o valor para ver o resumo do parcelamento.'));
          return;
        }
        var c = contas();
        if (!totalManual) campoTotal.value = emReais(c.total);

        // Mandando pelo valor da parcela, a quantidade de vezes segue a conta.
        var quantas = c.itens.length;
        if (c.porParcela && quantas !== vezes) {
          vezes = quantas;
          campoVezes.value = String(Math.min(quantas, 24));
        }

        resumo.appendChild(no('div', 'rotulo', 'Vai ser cobrado'));
        resumo.appendChild(no('div', 'valorao pequeno num', emReais(c.total)));
        var primeiro = c.itens[0].valor, ultimo = c.itens[quantas - 1].valor;
        var detalhe = quantas + 'x de ' + emReais(primeiro);
        if (quantas > 1 && primeiro !== ultimo) {
          detalhe = (quantas - 1) + 'x de ' + emReais(primeiro) +
            ' e a última de ' + emReais(ultimo);
        }
        resumo.appendChild(no('div', 'linha-nota', detalhe));
        if (c.acrescimoTotal > 0) {
          resumo.appendChild(no('div', 'linha-nota ouro',
            'Acréscimo de ' + emReais(c.acrescimoTotal) + ' sobre os ' + emReais(base) + ' combinados.'));
        } else if (c.acrescimoTotal < 0) {
          resumo.appendChild(no('div', 'linha-nota verde',
            'Desconto de ' + emReais(-c.acrescimoTotal) + ' sobre os ' + emReais(base) + ' combinados.'));
        }

        var juros = comoNumero(campoJuros.value, 0);
        if (juros > 0) {
          resumo.appendChild(no('div', 'linha-nota',
            'Atrasando, entram ' + numeroBr(juros) + '% ao mês sobre a parcela, contados por dia.'));
        }

        var lista = no('div');
        lista.style.marginTop = '12px';
        c.itens.forEach(function (p) {
          var linha = no('div', 'parcela-linha');
          juntar(linha,
            no('span', 'q', p.numero + '/' + p.total + ' · ' + dataBr(p.vencimento)),
            no('span', 'v num', emReais(p.valor)));
          lista.appendChild(linha);
        });
        resumo.appendChild(lista);
      }

      // Mexer no valor, nas vezes ou no acréscimo devolve o total ao cálculo.
      function recalcular() { totalManual = 0; pintarResumo(); }
      campoValorEl.addEventListener('input', recalcular);
      campoPorParcela.addEventListener('input', function () {
        parcelaManual = digitosParaCentavos(campoPorParcela.value);
        pintarResumo();
      });
      campoData.addEventListener('change', pintarResumo);
      campoPorcento.addEventListener('input', recalcular);
      campoReais.addEventListener('input', recalcular);
      campoJuros.addEventListener('input', pintarResumo);
      campoTotal.addEventListener('input', function () {
        totalManual = digitosParaCentavos(campoTotal.value);
        pintarResumo();
      });
      campoVezes.aoMudar = function (v) {
        // Escolher as vezes na mão desliga o comando pelo valor da parcela.
        parcelaManual = 0;
        campoPorParcela.value = emReais(0);
        vezes = parseInt(v, 10) || 1;
        recalcular();
      };
      campoModo.aoMudar = function (v) {
        modo = v;
        caixaPorcento.style.display = v === 'porcento' ? '' : 'none';
        caixaReais.style.display = v === 'reais' ? '' : 'none';
        recalcular();
      };
      pintarResumo();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Confirmar parcelamento', function () {
        var base = digitosParaCentavos(campoValorEl.value);
        if (base <= 0) { mostrarErro(forma, 'Informe o valor a combinar.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha a data da primeira parcela.'); return; }
        var c = contas();

        var ultimaP = c.itens[c.itens.length - 1];
        perguntar({
          titulo: 'Confirmar ' + c.itens.length + 'x de ' + emReais(c.itens[0].valor) + '?',
          texto: 'Total de ' + emReais(c.total) +
            (c.acrescimoTotal > 0 ? ', com ' + emReais(c.acrescimoTotal) + ' de acréscimo' : '') +
            (c.itens.length > 1 && ultimaP.valor !== c.itens[0].valor
              ? '. A última fica em ' + emReais(ultimaP.valor) : '') +
            '. Primeira em ' + dataBr(c.itens[0].vencimento) +
            ', última em ' + dataBr(ultimaP.vencimento) + '.',
          ok: 'Confirmar', icone: 'alvo'
        }, function () {
          var jurosSalvo = Math.min(Math.max(comoNumero(campoJuros.value, 0), 0), 100);
          c.itens.forEach(function (p) {
            estado.parcelas.push({
              id: novoId(),
              clienteId: clienteId,
              servicoId: campoServico.value,
              numero: p.numero,
              total: p.total,
              valor: p.valor,
              vencimento: p.vencimento,
              minimo: 0,
              jurosAtraso: jurosSalvo,
              quitadaEm: '',
              pagamentoId: '',
              criadoEm: Date.now()
            });
          });
          // O acréscimo é dinheiro a mais a receber: entra como registro próprio.
          if (c.acrescimoTotal > 0) {
            estado.servicos.push({
              id: novoId(), clienteId: clienteId,
              nome: 'Acréscimo do parcelamento em ' + c.itens.length + 'x',
              tipo: TIPO_PADRAO, valor: c.acrescimoTotal,
              data: c.itens[0].vencimento, obs: '', criadoEm: Date.now()
            });
          }
          salvar();
          abaFicha = 'parcelas';
          voltarNavegacao();
          avisar('Parcelamento combinado.');
        });
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // O que fazer com uma parcela que ainda está em aberto.
  function abrirFolhaParcela(clienteId, parcelaId) {
    var parcela = achar(estado.parcelas, parcelaId);
    if (!parcela) return;
    var servico = parcela.servicoId ? achar(estado.servicos, parcela.servicoId) : null;
    var servicos = servicosDoCliente(clienteId);
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha('Parcela ' + parcela.numero + ' de ' + parcela.total, function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(parcela.valor, true);
      campoValorEl.style.color = 'var(--ouro)';
      forma.appendChild(campo('Valor da parcela', campoValorEl));

      var campoData = entradaData(parcela.vencimento);
      forma.appendChild(campo('Vence em', campoData));

      var campoJuros = entradaTextoNumero(parcela.jurosAtraso || '', '0');
      forma.appendChild(campo('Juros por atraso, ao mês (opcional %)', campoJuros));

      var opcoesServico = [{ valor: '', rotulo: 'Sem registro específico' }].concat(
        servicos.map(function (sv) {
          return { valor: sv.id, rotulo: sv.nome, detalhe: (sv.tipo || 'Serviço') + ' · ' + emReais(sv.valor) };
        }));
      var campoServico = entradaSelecao(opcoesServico, parcela.servicoId || '', 'Referente a');
      forma.appendChild(campo('Referente a', campoServico));

      var jaPago = pagoNaParcela(parcela);
      var juros = jurosDaParcela(parcela);
      if (parcela.vencimento < hojeTexto()) {
        forma.appendChild(no('div', 'linha-nota vermelho',
          'Esta parcela venceu em ' + dataBr(parcela.vencimento) + '.' +
          (juros > 0 ? ' Os juros já somam ' + emReais(juros) + '.' : '')));
      }
      if (jaPago > 0) {
        forma.appendChild(no('div', 'linha-nota verde',
          'Já entraram ' + emReais(jaPago) + '. Faltam ' + emReais(faltaNaParcela(parcela)) + '.'));
      }
      if (servico) {
        forma.appendChild(no('div', 'linha-nota',
          'Faz parte de ' + parcela.total + ' parcelas de ' + servico.nome + '.'));
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Registrar pagamento', function () {
        voltarNavegacao();
        setTimeout(function () { abrirFolhaPagamento(clienteId, null, parcelaId); }, 250);
      }));
      acoes.appendChild(botao('btn btn-fantasma', 'Salvar alterações', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor da parcela.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }
        parcela.valor = valor;
        parcela.vencimento = campoData.value;
        parcela.servicoId = campoServico.value;
        parcela.minimo = 0;
        parcela.jurosAtraso = Math.min(Math.max(comoNumero(campoJuros.value, 0), 0), 100);
        salvar();
        voltarNavegacao();
        avisar('Parcela atualizada.');
      }));
      acoes.appendChild(botao('btn btn-perigo', 'Excluir esta parcela', function () {
        perguntar({
          titulo: 'Excluir a parcela ' + parcela.numero + ' de ' + parcela.total + '?',
          texto: 'As outras parcelas continuam como estão.',
          ok: 'Excluir parcela', tom: 'perigo'
        }, function () {
          marcarExcluido('parcelas', parcela.id);
          estado.parcelas = estado.parcelas.filter(function (p) { return p.id !== parcela.id; });
          salvar();
          voltarNavegacao();
          avisar('Parcela excluída.');
        });
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function abrirFolhaPagamento(clienteId, pagamentoId, parcelaId) {
    var existente = pagamentoId ? achar(estado.pagamentos, pagamentoId) : null;
    var parcela = parcelaId ? achar(estado.parcelas, parcelaId) : null;
    if (!parcela && existente && existente.parcelaId) parcela = achar(estado.parcelas, existente.parcelaId);
    var r = resumoCliente(clienteId);
    var servicos = servicosDoCliente(clienteId);
    var lancarNoCaixa = !existente;
    empilhar({ tipo: 'aba', voltar: function () { montarFichaCliente(clienteId); } });

    abrirFolha(existente ? 'Editar pagamento' : 'Registrar pagamento', function (folha) {
      var forma = no('div');

      var campoValorEl = entradaValor(existente ? existente.valor : 0, true);
      campoValorEl.style.color = 'var(--verde)';
      forma.appendChild(campo('Valor recebido', campoValorEl));

      // ---- a qual parcela este dinheiro se refere ----
      var abertas = parcelasDoCliente(clienteId).filter(function (p) {
        return !parcelaPaga(p) || (parcela && p.id === parcela.id);
      });
      var opcoesParcela = [{ valor: '', rotulo: 'Sem parcela específica' }].concat(
        abertas.map(function (p) {
          var servicoP = p.servicoId ? achar(estado.servicos, p.servicoId) : null;
          return {
            valor: p.id,
            rotulo: 'Parcela ' + p.numero + ' de ' + p.total,
            detalhe: 'vence em ' + dataBr(p.vencimento) + ' · ' + emReais(faltaNaParcela(p)) +
              (servicoP ? ' · ' + servicoP.nome : '')
          };
        }));

      var campoParcela = null;
      if (abertas.length) {
        campoParcela = entradaSelecao(opcoesParcela, parcela ? parcela.id : '', 'Equivale a qual parcela');
        forma.appendChild(campo('Equivale a qual parcela', campoParcela));
      }

      var caixaAtalhos = no('div');
      forma.appendChild(caixaAtalhos);

      var campoData = entradaData(existente ? existente.data : hojeTexto());
      forma.appendChild(campo('Data do pagamento', campoData));

      var opcoesServico = [{ valor: '', rotulo: 'Sem registro específico' }].concat(
        servicos.map(function (s) {
          return { valor: s.id, rotulo: s.nome, detalhe: (s.tipo || 'Serviço') + ' · ' + emReais(s.valor) };
        }));
      var campoServico = entradaSelecao(opcoesServico,
        existente ? existente.servicoId : (parcela ? parcela.servicoId : ''), 'Referente a');
      forma.appendChild(campo('Referente a', campoServico));

      // ---- juros, multa e taxa lançados na hora ----
      var campoJuros = null, campoMulta = null, campoTaxa = null, resumoParcela = null;
      if (!existente) {
        forma.appendChild(no('div', 'rotulo-secao', 'Acréscimos deste pagamento'));

        campoJuros = entradaValor(0, false);
        forma.appendChild(campo('Juros de atraso', campoJuros));
        campoMulta = entradaValor(0, false);
        forma.appendChild(campo('Multa', campoMulta));
        campoTaxa = entradaValor(0, false);
        forma.appendChild(campo('Taxa', campoTaxa));

        resumoParcela = cartao();
        forma.appendChild(resumoParcela);
      }

      function parcelaAtual() {
        var id = campoParcela ? campoParcela.value : (parcela ? parcela.id : '');
        return id ? achar(estado.parcelas, id) : null;
      }

      function acrescimos() {
        if (existente) return 0;
        return digitosParaCentavos(campoJuros.value) +
               digitosParaCentavos(campoMulta.value) +
               digitosParaCentavos(campoTaxa.value);
      }

      // Quanto esta parcela deve hoje, já com o que foi lançado agora.
      function devidoAgora(p) {
        return p ? faltaNaParcela(p) + acrescimos() : 0;
      }

      function pintarAtalhos() {
        caixaAtalhos.textContent = '';
        if (existente) return;
        var p = parcelaAtual();
        if (!p) {
          if (!existente && r.restante > 0) {
            var chips = no('div', 'chips');
            chips.appendChild(botao('chip', 'Tudo: ' + emReais(r.restante), function () {
              campoValorEl.value = emReais(r.restante); pintarResumo();
            }));
            chips.appendChild(botao('chip', 'Metade', function () {
              campoValorEl.value = emReais(Math.round(r.restante / 2)); pintarResumo();
            }));
            caixaAtalhos.appendChild(campo('Falta ' + emReais(r.restante), chips));
          }
          return;
        }
        var devido = devidoAgora(p);
        var minimo = Math.min(minimoDaParcela(p) || 0, devido);
        var chipsP = no('div', 'chips');
        chipsP.appendChild(botao('chip', 'Tudo: ' + emReais(devido), function () {
          campoValorEl.value = emReais(devido); pintarResumo();
        }));
        if (minimo > 0 && minimo < devido) {
          chipsP.appendChild(botao('chip', 'Mínimo: ' + emReais(minimo), function () {
            campoValorEl.value = emReais(minimo); pintarResumo();
          }));
        }
        chipsP.appendChild(botao('chip', 'Metade', function () {
          campoValorEl.value = emReais(Math.round(devido / 2)); pintarResumo();
        }));
        caixaAtalhos.appendChild(campo('Devido nesta parcela: ' + emReais(devido), chipsP));
      }

      function pintarResumo() {
        if (!resumoParcela) return;
        resumoParcela.textContent = '';
        var p = parcelaAtual();
        var recebido = digitosParaCentavos(campoValorEl.value);
        var extra = acrescimos();

        if (!p) {
          resumoParcela.appendChild(no('div', 'linha-sub',
            extra > 0
              ? 'Sem parcela escolhida, os ' + emReais(extra) + ' de acréscimo entram como valor a receber deste cliente.'
              : 'Escolha a parcela para o app fechar a conta dela e remanejar o que faltar.'));
          return;
        }

        var devido = devidoAgora(p);
        var falta = Math.max(devido - recebido, 0);
        var sobra = Math.max(recebido - devido, 0);

        resumoParcela.appendChild(no('div', 'rotulo', 'Parcela ' + p.numero + ' de ' + p.total));
        [
          ['Valor da parcela', emReais(faltaNaParcela(p))],
          ['Acréscimos agora', emReais(extra)],
          ['Devido', emReais(devido)],
          ['Recebendo', emReais(recebido)]
        ].forEach(function (par) {
          var l = no('div', 'parcela-linha');
          juntar(l, no('span', 'q', par[0]), no('span', 'v num', par[1]));
          resumoParcela.appendChild(l);
        });

        if (falta > 0) {
          var teto = tetoDoPlano(planoDaParcela(p)) || falta;
          var quantas = Math.ceil(falta / teto);
          resumoParcela.appendChild(no('div', 'linha-nota ouro',
            'A parcela fecha assim mesmo. Os ' + emReais(falta) + ' que faltaram viram ' +
            quantas + ' parcela(s) no fim do combinado, de no máximo ' + emReais(teto) + ' cada.'));
        } else if (sobra > 0) {
          resumoParcela.appendChild(no('div', 'linha-nota verde',
            'A parcela fecha e os ' + emReais(sobra) + ' que sobraram abatem as próximas.'));
        } else {
          resumoParcela.appendChild(no('div', 'linha-nota verde', 'Fecha a parcela na conta certa.'));
        }
      }

      function atualizar() { pintarAtalhos(); pintarResumo(); }

      campoValorEl.addEventListener('input', pintarResumo);
      if (campoParcela) {
        campoParcela.aoMudar = function () {
          var p = parcelaAtual();
          if (p) {
            // Sugere os juros de atraso já calculados e o valor cheio.
            if (campoJuros) campoJuros.value = emReais(jurosDaParcela(p));
            campoValorEl.value = emReais(devidoAgora(p));
            if (p.servicoId) campoServico.value = p.servicoId;
          }
          atualizar();
        };
      }
      if (campoJuros) {
        [campoJuros, campoMulta, campoTaxa].forEach(function (c) {
          c.addEventListener('input', atualizar);
        });
        var inicial = parcelaAtual();
        if (inicial) {
          campoJuros.value = emReais(jurosDaParcela(inicial));
          campoValorEl.value = emReais(devidoAgora(inicial));
        }
      }
      atualizar();

      var proximaDepois = proximoVencimento(clienteId);
      if (proximaDepois) {
        var notaProxima = no('div', 'linha-nota',
          'Próximo pagamento previsto para ' + dataBr(proximaDepois) + '.');
        notaProxima.style.margin = '-6px 0 14px';
        forma.appendChild(notaProxima);
      }

      var campoConta = null;
      if (!existente && estado.contas.length) {
        var marcar = botao('lembrar', null, function () {
          lancarNoCaixa = !lancarNoCaixa;
          marcar.setAttribute('aria-pressed', lancarNoCaixa ? 'true' : 'false');
          marcar.querySelector('.caixinha').textContent = lancarNoCaixa ? '✓' : '';
          campoConta.parentNode.style.display = lancarNoCaixa ? '' : 'none';
        });
        marcar.setAttribute('aria-pressed', 'true');
        marcar.style.marginBottom = '14px';
        marcar.appendChild(no('span', 'caixinha', '✓'));
        marcar.appendChild(no('span', null, 'Lançar como entrada no caixa'));
        forma.appendChild(marcar);

        campoConta = entradaSelecao(opcoesDeConta(), estado.contas[0].id);
        forma.appendChild(campo('Entrou em qual conta', campoConta));
      }

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Salvar', function () {
        var valor = digitosParaCentavos(campoValorEl.value);
        if (valor <= 0) { mostrarErro(forma, 'Informe o valor recebido.'); return; }
        if (!ehData(campoData.value)) { mostrarErro(forma, 'Escolha uma data válida.'); return; }

        var cliente = achar(estado.clientes, clienteId);

        if (existente) {
          var antiga = existente.parcelaId ? achar(estado.parcelas, existente.parcelaId) : null;
          var nova = campoParcela ? achar(estado.parcelas, campoParcela.value) : antiga;

          if (antiga && (!nova || nova.id !== antiga.id)) antiga.quitadaEm = '';
          existente.parcelaId = nova ? nova.id : '';
          if (nova) nova.quitadaEm = campoData.value;

          existente.valor = valor;
          existente.data = campoData.value;
          existente.servicoId = campoServico.value;
          if (existente.lancamentoId) {
            var lanc = achar(estado.lancamentos, existente.lancamentoId);
            if (lanc) { lanc.valor = valor; lanc.data = campoData.value; }
          }
          acertarParcelas(clienteId, nova);
        } else {
          var alvo = parcelaAtual();
          var extra = acrescimos();
          var lancamentoId = '';

          if (lancarNoCaixa && campoConta) {
            lancamentoId = novoId();
            var servico = campoServico.value ? achar(estado.servicos, campoServico.value) : null;
            estado.lancamentos.push({
              id: lancamentoId,
              tipo: 'entrada',
              valor: valor,
              descricao: (cliente ? cliente.nome : 'Cliente') + (servico ? ' — ' + servico.nome : ''),
              categoria: 'Serviços',
              data: campoData.value,
              contaId: campoConta.value,
              contaDestinoId: '',
              criadoEm: Date.now()
            });
          }

          // Juros, multa e taxa são dinheiro a mais a receber: entram como
          // registro próprio, senão a conta do cliente não fecha.
          if (extra > 0) {
            var partes = [];
            if (digitosParaCentavos(campoJuros.value) > 0) partes.push('juros');
            if (digitosParaCentavos(campoMulta.value) > 0) partes.push('multa');
            if (digitosParaCentavos(campoTaxa.value) > 0) partes.push('taxa');
            estado.servicos.push({
              id: novoId(), clienteId: clienteId,
              nome: partes.join(', ').replace(/^./, function (c) { return c.toUpperCase(); }) +
                (alvo ? ' — parcela ' + alvo.numero + ' de ' + alvo.total : ''),
              tipo: TIPO_PADRAO, valor: extra,
              data: campoData.value, obs: '', criadoEm: Date.now()
            });
          }

          var devido = alvo ? devidoAgora(alvo) : 0;
          estado.pagamentos.push({
            id: novoId(), clienteId: clienteId, servicoId: campoServico.value,
            valor: valor, data: campoData.value,
            parcelaId: alvo ? alvo.id : '',
            lancamentoId: lancamentoId, criadoEm: Date.now()
          });

          if (alvo) {
            // A parcela fecha com o que foi recebido, seja quanto for. O que
            // faltou volta para o fim do combinado; o que sobrou abate as
            // próximas.
            alvo.quitadaEm = campoData.value;
            var falta = Math.max(devido - valor, 0);
            var sobra = Math.max(valor - devido, 0);
            if (falta > 0) empurrarFalta(alvo, falta);
            else if (sobra > 0) abaterSobra(alvo, sobra);
          }
          acertarParcelas(clienteId, alvo);
        }

        salvar();
        voltarNavegacao();
        avisar(existente ? 'Pagamento atualizado.' : 'Pagamento registrado.');
      }));

      if (existente) {
        acoes.appendChild(botao('btn btn-perigo', 'Excluir pagamento', function () {
          perguntar({
            titulo: 'Excluir este pagamento?',
            texto: 'O lançamento de entrada criado junto com ele também sai, a parcela volta a ficar em aberto ' +
              'e o combinado é reajustado para bater com o que o cliente passa a dever.',
            ok: 'Excluir pagamento', tom: 'perigo'
          }, function () {
            if (existente.lancamentoId) {
              marcarExcluido('lancamentos', existente.lancamentoId);
              estado.lancamentos = estado.lancamentos.filter(function (l) { return l.id !== existente.lancamentoId; });
            }
            marcarExcluido('pagamentos', existente.id);
            estado.pagamentos = estado.pagamentos.filter(function (p) { return p.id !== existente.id; });
            estado.parcelas.forEach(function (p) {
              if (p.pagamentoId === existente.id) p.pagamentoId = '';
              if (p.id === existente.parcelaId) p.quitadaEm = '';
            });
            acertarParcelas(clienteId, null);
            salvar();
            voltarNavegacao();
            avisar('Pagamento excluído.');
          });
        }));
      }

      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  function blocoKpi(rotulo, valor, anterior, classeCor) {
    var k = no('div', 'kpi');
    k.appendChild(no('div', 'rotulo', rotulo));
    k.appendChild(no('div', 'n num ' + classeCor, emReais(valor)));
    if (anterior) {
      var dif = valor - anterior;
      var p = (dif / Math.abs(anterior)) * 100;
      var v = no('div', 'variacao ' + (dif >= 0 ? 'sobe' : 'desce'),
        (dif >= 0 ? '↑ ' : '↓ ') + Math.abs(p).toFixed(1).replace('.', ',') + '%');
      k.appendChild(v);
    } else {
      k.appendChild(no('div', 'variacao', ' '));
    }
    return k;
  }

  function parDeValores(rotulo, valor, classeCor) {
    var d = no('div');
    d.appendChild(no('div', 'rotulo', rotulo));
    d.appendChild(no('div', 'linha-valor num ' + (classeCor || ''), valor));
    return d;
  }

  // ---------- Tela: Transações ----------

  function desenharTransacoes() {
    var tela = $('telaTransacoes');
    tela.textContent = '';
    tela.appendChild(cabecalho('Transações', null, periodo.tipo === 'mes' ? true : 'periodo'));

    var busca = no('div', 'busca');
    var lupa = no('span', 'lupa');
    lupa.appendChild(icone('lupa'));
    busca.appendChild(lupa);
    var campo = no('input');
    campo.type = 'search';
    campo.placeholder = 'Buscar por descrição ou categoria';
    campo.value = buscaTransacoes;
    campo.addEventListener('input', function () {
      buscaTransacoes = campo.value;
      desenharListaTransacoes();
    });
    busca.appendChild(campo);
    tela.appendChild(busca);

    tela.appendChild(segmentos([
      { valor: 'mes', rotulo: nomeDoPeriodo('mes') },
      { valor: 'tres', rotulo: 'Últimos 3 meses' },
      { valor: 'ano', rotulo: 'Último ano' },
      { valor: 'escolhido', rotulo: 'Escolher datas' }
    ], periodo.tipo, function (v) {
      trocarPeriodo(v, function () { desenharTransacoes(); });
    }));

    tela.appendChild(segmentos([
      { valor: 'todas', rotulo: 'Todas' },
      { valor: 'entrada', rotulo: 'Receitas' },
      { valor: 'saida', rotulo: 'Despesas' },
      { valor: 'transferencia', rotulo: 'Transferências' }
    ], filtroTransacoes, function (v) { filtroTransacoes = v; desenharTransacoes(); }));

    var container = no('div');
    container.id = 'listaTransacoes';
    tela.appendChild(container);
    desenharListaTransacoes();
  }

  function nomeDoPeriodo(qual) {
    if (qual === 'tres') return '3 meses';
    if (qual === 'ano') return '12 meses';
    if (qual === 'escolhido') return 'Escolhido';
    var mesmoAno = mesAtivo.ano === new Date().getFullYear();
    return MESES_CURTO[mesAtivo.mes] + (mesmoAno ? '' : '/' + String(mesAtivo.ano).slice(2));
  }

  // A janela de tempo que as telas estão olhando.
  function faixaDoPeriodo() {
    if (periodo.tipo === 'escolhido' && ehData(periodo.de) && ehData(periodo.ate)) {
      return {
        de: periodo.de, ate: periodo.ate,
        rotulo: 'de ' + dataBr(periodo.de) + ' a ' + dataBr(periodo.ate),
        curto: dataCurta(periodo.de) + ' a ' + dataCurta(periodo.ate)
      };
    }
    if (periodo.tipo === 'tres' || periodo.tipo === 'ano') {
      var meses = periodo.tipo === 'tres' ? 3 : 12;
      var hoje = new Date();
      var inicio = new Date(hoje.getFullYear(), hoje.getMonth() - (meses - 1), 1);
      return {
        de: deData(inicio), ate: hojeTexto(),
        rotulo: meses === 3 ? 'nos últimos 3 meses' : 'nos últimos 12 meses',
        curto: meses === 3 ? 'Últimos 3 meses' : 'Último ano'
      };
    }
    return {
      de: prefixoMes(mesAtivo.ano, mesAtivo.mes) + '-01',
      ate: ultimoDiaDoMes(mesAtivo.ano, mesAtivo.mes),
      rotulo: 'em ' + MESES[mesAtivo.mes],
      curto: MESES[mesAtivo.mes].charAt(0).toUpperCase() + MESES[mesAtivo.mes].slice(1) +
        (mesAtivo.ano === new Date().getFullYear() ? '' : ' ' + mesAtivo.ano)
    };
  }

  // A janela de mesmo tamanho logo antes, para comparar.
  function faixaAnterior() {
    if (periodo.tipo === 'mes') {
      var a = mesAnteriorAo(mesAtivo.ano, mesAtivo.mes);
      return { de: prefixoMes(a.ano, a.mes) + '-01', ate: ultimoDiaDoMes(a.ano, a.mes) };
    }
    var f = faixaDoPeriodo();
    var dias = Math.round((comoData(f.ate) - comoData(f.de)) / 86400000) + 1;
    return { de: somaDias(f.de, -dias), ate: somaDias(f.de, -1) };
  }

  function lancamentosNaFaixa(faixa) {
    var f = faixa || faixaDoPeriodo();
    return estado.lancamentos.filter(function (l) {
      return l.data >= f.de && l.data <= f.ate;
    });
  }

  function lancamentosDoPeriodo() { return lancamentosNaFaixa(); }

  function totaisNaFaixa(faixa) {
    var entradas = 0, saidas = 0;
    lancamentosNaFaixa(faixa).forEach(function (l) {
      if (l.tipo === 'entrada') entradas += l.valor;
      else if (l.tipo === 'saida') saidas += l.valor;
    });
    return { entradas: entradas, saidas: saidas, saldo: entradas - saidas };
  }

  function gastosNaFaixa(faixa, tipo) {
    var lado = tipo === 'entrada' ? 'entrada' : 'saida';
    var mapa = {};
    var total = 0;
    lancamentosNaFaixa(faixa).forEach(function (l) {
      if (l.tipo !== lado) return;
      mapa[l.categoria] = (mapa[l.categoria] || 0) + l.valor;
      total += l.valor;
    });
    var lista = Object.keys(mapa).map(function (nome) {
      return { nome: nome, valor: mapa[nome] };
    }).sort(function (a, b) { return b.valor - a.valor; });
    return { lista: lista, total: total };
  }

  // ---------- Escolher o período ----------

  function trocarPeriodo(tipo, aoTerminar, doSeletor) {
    if (tipo === 'escolhido') { abrirFolhaPeriodo(aoTerminar); return; }
    // Escolher "mês atual" na lista traz de volta o mês de hoje; as setas
    // do cabeçalho continuam levando para os outros meses.
    if (tipo === 'mes' && doSeletor) {
      var hoje = new Date();
      mesAtivo = { ano: hoje.getFullYear(), mes: hoje.getMonth() };
    }
    periodo.tipo = tipo;
    if (aoTerminar) aoTerminar();
  }

  function abrirFolhaPeriodo(aoTerminar) {
    var f = faixaDoPeriodo();
    abrirFolha('Período', function (folha) {
      var forma = no('div');
      forma.appendChild(no('p', 'linha-sub', 'Escolha as duas pontas do período que quer ver.'));

      var campoDe = calendarioData(periodo.de || f.de, 'Começa em', function () { medir(); });
      forma.appendChild(campoDe);
      var campoAte = calendarioData(periodo.ate || f.ate, 'Termina em', function () { medir(); });
      campoAte.style.marginTop = '14px';
      forma.appendChild(campoAte);

      var nota = no('div', 'linha-nota');
      nota.style.marginTop = '10px';
      forma.appendChild(nota);
      function medir() {
        if (!ehData(campoDe.value) || !ehData(campoAte.value)) { nota.textContent = ''; return; }
        if (campoDe.value > campoAte.value) { nota.textContent = 'A data de início vem antes da de fim.'; return; }
        var dias = Math.round((comoData(campoAte.value) - comoData(campoDe.value)) / 86400000) + 1;
        var quantos = estado.lancamentos.filter(function (l) {
          return l.data >= campoDe.value && l.data <= campoAte.value;
        }).length;
        nota.textContent = dias + ' dia(s), com ' + quantos + ' lançamento(s).';
      }
      medir();

      var acoes = no('div', 'acoes');
      acoes.appendChild(botao('btn btn-ouro', 'Ver este período', function () {
        if (!ehData(campoDe.value) || !ehData(campoAte.value)) {
          mostrarErro(forma, 'Escolha as duas datas.'); return;
        }
        if (campoDe.value > campoAte.value) {
          mostrarErro(forma, 'A data de início precisa vir antes da de fim.'); return;
        }
        periodo.tipo = 'escolhido';
        periodo.de = campoDe.value;
        periodo.ate = campoAte.value;
        fecharFolha();
        setTimeout(function () { if (aoTerminar) aoTerminar(); else desenhar(); }, 250);
      }));
      forma.appendChild(acoes);
      folha.appendChild(forma);
    });
  }

  // A pílula que abre a lista de períodos.
  function seletorDePeriodo(aoTrocar) {
    var b = botao('pilula-periodo', null, function () {
      abrirEscolha({
        titulo: 'Período',
        valor: periodo.tipo,
        opcoes: [
          { valor: 'mes', rotulo: 'Mês atual',
            detalhe: MESES[new Date().getMonth()] + ' de ' + new Date().getFullYear() },
          { valor: 'tres', rotulo: 'Últimos 3 meses' },
          { valor: 'ano', rotulo: 'Último ano' },
          { valor: 'escolhido', rotulo: 'Escolher as datas',
            detalhe: periodo.tipo === 'escolhido' ? faixaDoPeriodo().curto : 'início e fim' }
        ]
      }, function (escolhido) {
        if (escolhido == null) return;
        trocarPeriodo(escolhido, aoTrocar, true);
      });
    });
    b.appendChild(icone('calendario'));
    b.appendChild(no('span', null, faixaDoPeriodo().curto));
    b.appendChild(no('span', 'seta', '▾'));
    return b;
  }

  function desenharListaTransacoes() {
    var alvo = $('listaTransacoes');
    if (!alvo) return;
    alvo.textContent = '';

    var termo = buscaTransacoes.trim().toLowerCase();
    var faixa = faixaDoPeriodo();
    var itens = lancamentosDoPeriodo().filter(function (l) {
      if (filtroTransacoes !== 'todas' && l.tipo !== filtroTransacoes) return false;
      if (!termo) return true;
      return (l.descricao + ' ' + l.categoria).toLowerCase().indexOf(termo) >= 0;
    });

    if (!itens.length) {
      var c = cartao('liso');
      c.appendChild(estadoVazio(
        termo ? 'Nada encontrado' : 'Nenhum lançamento',
        termo ? 'Tente outro termo de busca.'
              : 'Toque no + para registrar o primeiro movimento ' + faixa.rotulo + '.'
      ));
      alvo.appendChild(c);
      return;
    }

    var porDia = {};
    itens.forEach(function (l) { (porDia[l.data] = porDia[l.data] || []).push(l); });

    Object.keys(porDia).sort().reverse().forEach(function (data) {
      var doDia = porDia[data].slice().sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
      var totalDia = doDia.reduce(function (s, l) {
        return s + (l.tipo === 'entrada' ? l.valor : l.tipo === 'saida' ? -l.valor : 0);
      }, 0);

      var cab = no('div', 'dia-cabecalho');
      juntar(cab, no('div', 'dia-nome', nomeDoDia(data)), no('div', 'dia-total num', comSinal(totalDia)));
      alvo.appendChild(cab);

      var cartaoDia = cartao('liso');
      doDia.forEach(function (l) { cartaoDia.appendChild(linhaLancamento(l)); });
      alvo.appendChild(cartaoDia);
    });

    var totais = totaisNaFaixa(faixa);
    var entradas = totais.entradas, saidas = totais.saidas, saldo = totais.saldo;

    var resumo = cartao();
    resumo.style.marginTop = '16px';
    var linhaResumo = no('div', 'cartao-topo');
    linhaResumo.style.marginBottom = '8px';
    juntar(linhaResumo,
      no('div', 'cartao-titulo', 'Saldo do período'),
      no('div', 'linha-valor num ' + (saldo >= 0 ? 'verde' : 'vermelho'), emReais(saldo))
    );
    resumo.appendChild(linhaResumo);
